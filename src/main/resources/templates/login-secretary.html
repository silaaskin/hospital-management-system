<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sekreter Girişi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f3f4f6; }
    .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
  </style>
</head>
<body>
<div class="login-box text-center">
  <h3 class="mb-4 text-primary">📝 Sekreter Girişi</h3>
  <form id="secForm">
    <div class="mb-3">
      <input type="text" id="username" class="form-control" placeholder="Kullanıcı Adı" required>
    </div>
    <div class="mb-3">
      <input type="password" id="password" class="form-control" placeholder="Şifre" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
  </form>
  <div id="msg" class="mt-3 text-danger small"></div>
</div>

<script>
  document.getElementById('secForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    fetch('/secretaries/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: username, password: password })
    })
            .then(res => res.json())
            .then(data => {
              if(data.success) window.location.href = '/dashboard';
              else document.getElementById('msg').innerText = "Giriş başarısız!";
            });
  });
</script>
</body>
</html>
