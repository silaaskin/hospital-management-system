<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acil Triaj Paneli - MHRS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
        --critical: #dc3545;
        --urgent: #ffc107;
        --semi-urgent: #0d6efd;
        --non-urgent: #198754;
    }

    body {
        background: linear-gradient(135deg, #1a1d20 0%, #2c3e50 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
    }

    .emergency-header {
        background: linear-gradient(135deg, var(--critical) 0%, #e74c3c 100%);
        padding: 30px 40px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        margin-bottom: 30px;
    }

    .emergency-title {
        font-size: 32px;
        font-weight: 800;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .pulse-icon {
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    .subtitle {
        color: rgba(255,255,255,0.8);
        margin: 5px 0 0 0;
        font-size: 14px;
    }

    .control-panel {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .btn-filter {
        background: rgba(255,255,255,0.2);
        border: 2px solid rgba(255,255,255,0.5);
        color: white;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 10px;
        transition: all 0.3s;
    }

    .btn-filter:hover {
        background: white;
        color: var(--critical);
    }

    .btn-dashboard {
        background: white;
        color: var(--critical);
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 10px;
        border: none;
        transition: all 0.3s;
        text-decoration: none;
    }

    .btn-dashboard:hover {
        background: rgba(255,255,255,0.9);
        transform: translateY(-2px);
        color: var(--critical);
        text-decoration: none;
    }

    /* Empty State */
    .empty-state {
        text-align: center;
        padding: 80px 20px;
        background: rgba(255,255,255,0.1);
        border-radius: 20px;
        margin: 20px;
    }

    .empty-state i {
        font-size: 80px;
        color: var(--non-urgent);
        margin-bottom: 20px;
    }

    .empty-state h5 {
        color: white;
        font-weight: 600;
    }

    /* Triage Cards */
    .triage-grid {
        padding: 0 20px 40px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 25px;
    }

    .triage-card {
        border-radius: 15px;
        overflow: hidden;
        transition: all 0.3s;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        position: relative;
        animation: slideUp 0.6s ease-out;
    }

    /* Priority-based backgrounds - BOLD COLORS */
    .priority-CRITICAL {
        background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
    }

    .priority-URGENT {
        background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
    }

    .priority-SEMI_URGENT {
        background: linear-gradient(135deg, #0d6efd 0%, #0056b3 100%);
    }

    .priority-NON_URGENT {
        background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .triage-card:hover {
        transform: translateY(-10px) scale(1.02);
    }

    .priority-CRITICAL:hover {
        box-shadow: 0 15px 40px rgba(220,53,69,0.6);
    }

    .priority-URGENT:hover {
        box-shadow: 0 15px 40px rgba(255,193,7,0.6);
    }

    .priority-SEMI_URGENT:hover {
        box-shadow: 0 15px 40px rgba(13,110,253,0.6);
    }

    .priority-NON_URGENT:hover {
        box-shadow: 0 15px 40px rgba(25,135,84,0.6);
    }

    .priority-bar {
        display: none; /* Artık gerek yok, tüm kart renkli */
    }

    .card-content {
        padding: 25px 20px;
        color: white;
    }

    .status-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        z-index: 10;
    }

    .badge-treated {
        background: rgba(0,0,0,0.8);
        color: white;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        border: 2px solid rgba(255,255,255,0.5);
    }

    .badge-waiting {
        background: rgba(255,255,255,0.95);
        color: #2c3e50;
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        border: 2px solid rgba(255,255,255,0.5);
    }

    .patient-info {
        margin-bottom: 20px;
    }

    .patient-name {
        font-size: 22px;
        font-weight: 700;
        color: white;
        margin-bottom: 5px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .patient-tc {
        color: rgba(255,255,255,0.9);
        font-size: 13px;
    }

    /* Vitals */
    .vitals-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
    }

    .vital-box {
        background: rgba(255,255,255,0.95);
        padding: 15px 10px;
        border-radius: 12px;
        text-align: center;
        border: 2px solid rgba(255,255,255,0.3);
        backdrop-filter: blur(10px);
    }

    .vital-value {
        font-size: 22px;
        font-weight: 800;
        display: block;
        margin-bottom: 5px;
    }

    .vital-value.temperature { color: var(--critical); }
    .vital-value.heart { color: #2c3e50; }
    .vital-value.pressure { color: var(--semi-urgent); }

    .vital-label {
        font-size: 11px;
        color: #6c757d;
        font-weight: 600;
        text-transform: uppercase;
    }

    /* Symptoms Box */
    .symptoms-box {
        background: rgba(255,255,255,0.95);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
        backdrop-filter: blur(10px);
    }

    .symptoms-label {
        font-weight: 700;
        color: #2c3e50;
        font-size: 13px;
        margin-bottom: 8px;
    }

    .symptoms-text {
        color: #2c3e50;
        font-size: 14px;
        line-height: 1.5;
    }

    /* Action Buttons */
    .action-buttons {
        display: grid;
        gap: 10px;
    }

    .btn-action {
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 14px;
        border: none;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-action:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-prescription {
        background: rgba(255,255,255,0.95);
        color: #2c3e50;
        border: 2px solid rgba(255,255,255,0.3);
    }

    .btn-prescription:hover {
        background: white;
        color: #0d6efd;
    }

    .btn-complete {
        background: rgba(255,255,255,0.95);
        color: #2c3e50;
        border: 2px solid rgba(255,255,255,0.3);
    }

    .btn-complete:hover {
        background: white;
        color: #28a745;
    }

    .btn-edit {
        background: rgba(255,255,255,0.95);
        color: #2c3e50;
        border: 2px solid rgba(255,255,255,0.3);
    }

    .btn-edit:hover {
        background: white;
        color: #ffc107;
    }

    /* Time Footer */
    .time-footer {
        margin-top: 20px;
        padding-top: 15px;
        border-top: 2px solid rgba(255,255,255,0.3);
        text-align: right;
        color: rgba(255,255,255,0.9);
        font-size: 12px;
    }

    /* Modal Styling */
    .modal-content {
        background: #2c3e50;
        color: white;
        border-radius: 20px;
        border: none;
    }

    .modal-header {
        border-bottom: 2px solid rgba(255,255,255,0.1);
        padding: 25px 30px;
    }

    .modal-title {
        font-size: 22px;
        font-weight: 700;
        color: #17a2b8;
    }

    .modal-body {
        padding: 30px;
    }

    .form-label {
        font-weight: 600;
        margin-bottom: 8px;
        color: white;
    }

    .form-control-dark {
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.2);
        color: white;
        border-radius: 10px;
        padding: 12px;
    }

    .form-control-dark:focus {
        background: rgba(255,255,255,0.15);
        border-color: #17a2b8;
        color: white;
        box-shadow: 0 0 0 0.2rem rgba(23,162,184,0.25);
    }

    .form-control-dark::placeholder {
        color: rgba(255,255,255,0.5);
    }

    .btn-submit-modal {
        background: linear-gradient(135deg, #17a2b8 0%, #0d6efd 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 10px;
        font-weight: 700;
        transition: all 0.3s;
    }

    .btn-submit-modal:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(23,162,184,0.4);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .emergency-header {
            padding: 20px;
        }

        .emergency-title {
            font-size: 24px;
        }

        .control-panel {
            flex-direction: column;
            width: 100%;
        }

        .btn-filter,
        .btn-dashboard {
            width: 100%;
        }

        .triage-grid {
            grid-template-columns: 1fr;
            padding: 0 15px 30px;
        }

        .vitals-grid {
            grid-template-columns: 1fr;
        }
    }
  </style>
</head>
<body>

<div class="emergency-header">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <h2 class="emergency-title">
          <i class="fas fa-ambulance pulse-icon"></i>
          ACİL SERVİS MONİTÖRÜ
        </h2>
        <p class="subtitle" th:text="${pageTitle}">Triaj Listesi</p>
      </div>
      <div class="control-panel">
        <div th:if="${session.userType == 'DOCTOR'}">
          <a th:href="@{/triage/view(filter=${currentFilter == 'waiting' ? 'all' : 'waiting'})}"
             class="btn-filter">
            <i class="fas fa-filter me-2"></i>
            <span th:text="${currentFilter == 'waiting' ? 'Tümünü Göster' : 'Sadece Bekleyenler'}"></span>
          </a>
        </div>
        <a href="/dashboard" class="btn-dashboard">
          <i class="fas fa-home me-2"></i>
          Panele Dön
        </a>
      </div>
    </div>
  </div>
</div>

<div th:if="${#lists.isEmpty(triageRecords)}" class="empty-state">
  <i class="fas fa-check-circle"></i>
  <h5>Şu an görüntülenecek hasta bulunmamaktadır</h5>
</div>

<div class="triage-grid">
  <div class="triage-card"
       th:each="t, iterStat : ${triageRecords}"
       th:classappend="'priority-' + ${t.priority}"
       th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's'">

    <div class="priority-bar"></div>

    <div class="card-content">
      <div class="status-badge">
                <span th:if="${t.status == 'TREATED'}" class="badge-treated">
                    <i class="fas fa-check-double me-1"></i>
                    MUAYENE EDİLDİ
                </span>
        <span th:if="${t.status == 'WAITING' or t.status == null}" class="badge-waiting">
                    <i class="fas fa-clock me-1"></i>
                    BEKLİYOR
                </span>
      </div>

      <div class="patient-info">
        <div class="patient-name" th:text="${t.patient.firstName + ' ' + t.patient.lastName}">
          Hasta Adı
        </div>
        <div class="patient-tc">
          <i class="fas fa-id-card me-1"></i>
          TC: <span th:text="${t.patient.tcNo}"></span>
        </div>
      </div>

      <div class="vitals-grid">
        <div class="vital-box">
          <span class="vital-value temperature" th:text="${(t.temperature ?: '0') + '°'}">36.5°</span>
          <span class="vital-label">Ateş</span>
        </div>
        <div class="vital-box">
          <span class="vital-value heart" th:text="${(t.heartRate ?: '0')}">80</span>
          <span class="vital-label">Nabız</span>
        </div>
        <div class="vital-box">
                    <span class="vital-value pressure"
                          th:text="${(t.bloodPressureSystolic ?: '0') + '/' + (t.bloodPressureDiastolic ?: '0')}">
                        120/80
                    </span>
          <span class="vital-label">Tansiyon</span>
        </div>
      </div>

      <div class="symptoms-box">
        <div class="symptoms-label">
          <i class="fas fa-notes-medical me-2"></i>Şikayet
        </div>
        <div class="symptoms-text" th:text="${t.symptoms ?: 'Belirtilmedi'}">
          Hasta şikayeti
        </div>
      </div>

      <div class="action-buttons">
        <button th:if="${session.userType == 'DOCTOR'}"
                class="btn-action btn-prescription"
                data-bs-toggle="modal"
                data-bs-target="#triagePrescriptionModal"
                th:onclick="'prepareTriagePrescription(' + ${t.id} + ',' + ${session.userId} + ')'">
          <i class="fas fa-pills"></i>
          <span>Reçete Yaz</span>
        </button>

        <button th:if="${session.userType == 'DOCTOR' and (t.status == 'WAITING' or t.status == null)}"
                class="btn-action btn-complete"
                th:onclick="'completeTriage(' + ${t.id} + ')'">
          <i class="fas fa-user-check"></i>
          <span>Muayene Et</span>
        </button>

        <a th:if="${session.userType == 'SECRETARY'}"
           th:href="@{'/triage/edit/' + ${t.id}}"
           class="btn-action btn-edit">
          <i class="fas fa-edit"></i>
          <span>Bilgileri Güncelle</span>
        </a>
      </div>

      <div class="time-footer">
        <i class="far fa-clock me-1"></i>
        Giriş: <span th:text="${#temporals.format(t.triageDate, 'HH:mm')}"></span>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="triagePrescriptionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-file-medical me-2"></i>
          Acil Reçete Oluştur
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="triagePrescForm">
          <input type="hidden" id="tp_triageId">
          <input type="hidden" id="tp_doctorId">

          <div class="mb-3">
            <label class="form-label">
              İlaçlar <span class="text-danger">*</span>
            </label>
            <textarea id="tp_medications"
                      class="form-control-dark"
                      rows="3"
                      required
                      placeholder="Örn: Parol (2x1), Augmentin (3x1)"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Notlar (Opsiyonel)</label>
            <input type="text"
                   id="tp_notes"
                   class="form-control-dark"
                   placeholder="Eczacıya veya hastaya not...">
          </div>

          <div id="triageErrorMsg" class="alert alert-danger d-none"></div>

          <button type="submit" class="btn-submit-modal w-100">
            <i class="fas fa-save me-2"></i>
            Reçeteyi Kaydet
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function prepareTriagePrescription(triageId, docId) {
      console.log('Modal açılıyor - Triaj ID:', triageId, 'Doktor ID:', docId);

      document.getElementById('tp_triageId').value = triageId;
      document.getElementById('tp_doctorId').value = docId;
      document.getElementById('tp_medications').value = '';
      document.getElementById('tp_notes').value = '';
      document.getElementById('triageErrorMsg').classList.add('d-none');
  }

  document.getElementById('triagePrescForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const triageId = document.getElementById('tp_triageId').value;
      const doctorId = document.getElementById('tp_doctorId').value;
      const medications = document.getElementById('tp_medications').value;
      const notes = document.getElementById('tp_notes').value;

      if (!medications || medications.trim() === '') {
          const errorDiv = document.getElementById('triageErrorMsg');
          errorDiv.textContent = 'Lütfen ilaç bilgilerini girin!';
          errorDiv.classList.remove('d-none');
          return;
      }

      const data = {
          triageId: parseInt(triageId),
          doctorId: parseInt(doctorId),
          medications: medications,
          notes: notes
      };

      fetch('/prescriptions/api/triage', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
      })
      .then(async response => {
          const text = await response.text();
          let jsonData;

          try {
              jsonData = JSON.parse(text);
          } catch (e) {
              throw new Error('Sunucu geçersiz JSON döndürdü');
          }

          if (response.ok) {
              alert("✅ Reçete başarıyla kaydedildi!");
              bootstrap.Modal.getInstance(document.getElementById('triagePrescriptionModal')).hide();
              window.location.reload();
          } else {
              throw new Error(jsonData.error || jsonData.message || 'Bilinmeyen hata');
          }
      })
      .catch(err => {
          const errorDiv = document.getElementById('triageErrorMsg');
          errorDiv.textContent = '❌ Hata: ' + err.message;
          errorDiv.classList.remove('d-none');
      });
  });

  function completeTriage(id) {
      if(confirm("Bu hastanın muayenesini tamamlandı olarak işaretlemek istiyor musunuz?")) {
          fetch('/triage/api/' + id + '/complete', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' }
          })
          .then(res => {
              if(res.ok) {
                  alert("✅ Muayene başarıyla tamamlandı.");
                  window.location.reload();
              } else {
                  throw new Error('İşlem başarısız');
              }
          })
          .catch(err => {
              alert("❌ Hata oluştu: " + err.message);
          });
      }
  }
</script>

</body>
</html>
