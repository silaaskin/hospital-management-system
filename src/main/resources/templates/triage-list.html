<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Acil / Triaj Paneli</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; min-height: 100vh; }
    .navbar-custom { background: linear-gradient(90deg, #1e1b4b 0%, #15803d 50%, #7c2d12 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
    .page-header { background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%); padding: 40px 0; margin-bottom: 40px; box-shadow: 0 4px 20px rgba(127, 29, 29, 0.3); }
    .page-header h2 { font-size: 2.2rem; font-weight: 700; margin-bottom: 5px; }
    .page-header p { opacity: 0.95; margin-bottom: 0; }
    .container-custom { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 15px; flex-wrap: wrap; }
    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-filter { background: rgba(255,255,255,0.1); color: white; padding: 10px 18px; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
    .btn-filter.active { background: linear-gradient(135deg, #dc2626, #991b1b); border-color: #991b1b; }
    .btn-filter:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
    .btn-add { background: linear-gradient(135deg, #dc2626, #991b1b); color: white; padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600; text-decoration: none; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(220, 38, 38, 0.3); color: white; }
    .triage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .triage-card { border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s; border-left: 6px solid #6b7280; position: relative; }
    .priority-CRITICAL { border-left-color: #dc2626; background: linear-gradient(135deg, rgba(220, 38, 38, 0.15), rgba(127, 29, 29, 0.15)); }
    .priority-URGENT { border-left-color: #f59e0b; background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(180, 83, 9, 0.15)); }
    .priority-SEMI_URGENT { border-left-color: #0891b2; background: linear-gradient(135deg, rgba(8, 145, 178, 0.15), rgba(6, 95, 70, 0.15)); }
    .priority-NON_URGENT { border-left-color: #10b981; background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(6, 95, 70, 0.15)); }
    .triage-card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
    .status-badge { position: absolute; top: 15px; right: 15px; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.75rem; }
    .status-waiting { background: #3b82f6; color: white; }
    .status-treated { background: #10b981; color: white; }
    .card-header-triage { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .patient-name { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 5px; }
    .patient-tc { font-size: 0.9rem; color: #cbd5e1; }
    .card-body-triage { padding: 20px; }
    .vitals-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .vital-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    .vital-label { font-size: 0.75rem; color: #cbd5e1; margin-bottom: 4px; }
    .vital-value { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .vital-icon { margin-right: 5px; }
    .symptoms-section { margin-bottom: 15px; }
    .symptoms-label { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; margin-bottom: 6px; }
    .symptoms-text { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; border-left: 3px solid #f59e0b; color: #f1f5f9; font-size: 0.9rem; }
    .action-buttons { display: flex; gap: 10px; }
    .btn-action { padding: 8px 14px; border: none; border-radius: 6px; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .btn-prescription { background: #3b82f6; color: white; }
    .btn-prescription:hover { background: #2563eb; color: white; }
    .btn-complete { background: #10b981; color: white; }
    .btn-complete:hover { background: #059669; color: white; }
    .btn-edit { background: #6366f1; color: white; }
    .btn-edit:hover { background: #4f46e5; color: white; }
    .empty-state { text-align: center; padding: 100px 20px; }
    .empty-state i { font-size: 5rem; color: #4b5563; margin-bottom: 20px; }
    .empty-state h4 { color: #cbd5e1; font-weight: 600; margin-bottom: 10px; }
    .empty-state p { color: #94a3b8; }
    @media (max-width: 768px) {
      .page-header h2 { font-size: 1.6rem; }
      .triage-grid { grid-template-columns: 1fr; }
      .vitals-grid { grid-template-columns: 1fr; }
      .action-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fas fa-ambulance"></i> Hastane Yönetim Sistemi</span>
    <a href="/dashboard" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Panele Dön</a>
  </div>
</nav>

<div class="page-header">
  <div class="container-custom">
    <h2><i class="fas fa-ambulance fa-beat"></i> ACİL SERVİS MONİTÖRÜ</h2>
    <p>Triaj Listesi ve Acil Durumlar</p>
  </div>
</div>

<div class="container-custom">
  <div class="action-bar">
    <div class="filter-group">
      <button class="btn-filter active" onclick="filterTriage('all')">
        <i class="fas fa-list"></i> Tümü
      </button>
      <button class="btn-filter" onclick="filterTriage('waiting')">
        <i class="fas fa-clock"></i> Bekleyenler
      </button>
      <button class="btn-filter" onclick="filterTriage('treated')">
        <i class="fas fa-check-circle"></i> Muayene Edilenler
      </button>
    </div>
    <a href="/triage/add" class="btn-add" th:if="${session.userType == 'SECRETARY'}">
      <i class="fas fa-plus-circle"></i> Yeni Acil Kaydı
    </a>
  </div>

  <div th:if="${#lists.isEmpty(triageRecords)}" class="empty-state">
    <i class="fas fa-check-circle"></i>
    <h4>Kayıt Bulunamadı</h4>
    <p>Şu an görüntülenecek hasta bulunmamaktadır.</p>
  </div>

  <div class="triage-grid">
    <div th:each="t : ${triageRecords}" th:classappend="'priority-' + ${t.priority}" class="triage-card">
      <div class="status-badge" th:classappend="${t.status == 'TREATED' ? 'status-treated' : 'status-waiting'}">
        <i th:classappend="${t.status == 'TREATED' ? 'fas fa-check-double' : 'fas fa-clock'}"></i>
        <span th:text="${t.status == 'TREATED' ? 'MUAYENE EDİLDİ' : 'BEKLİYOR'}"></span>
      </div>

      <div class="card-header-triage">
        <div class="patient-name" th:text="${t.patient.firstName + ' ' + t.patient.lastName}"></div>
        <div class="patient-tc">TC: <span th:text="${t.patient.tcNo}"></span></div>
      </div>

      <div class="card-body-triage">
        <div class="vitals-grid">
          <div class="vital-box">
            <div class="vital-label"><i class="vital-icon fas fa-thermometer-half"></i> Ateş</div>
            <div class="vital-value" th:text="${(t.temperature ?: '0') + '°'}"></div>
          </div>
          <div class="vital-box">
            <div class="vital-label"><i class="vital-icon fas fa-heart"></i> Nabız</div>
            <div class="vital-value" th:text="${(t.heartRate ?: '0')}"></div>
          </div>
          <div class="vital-box">
            <div class="vital-label"><i class="vital-icon fas fa-tint"></i> Tansiyon</div>
            <div class="vital-value" th:text="${(t.bloodPressureSystolic ?: '0') + '/' + (t.bloodPressureDiastolic ?: '0')}"></div>
          </div>
        </div>

        <div class="symptoms-section">
          <div class="symptoms-label"><i class="fas fa-comment-medical"></i> Şikayet</div>
          <div class="symptoms-text" th:text="${t.symptoms ?: 'Belirtilmedi'}"></div>
        </div>

        <div class="action-buttons">
          <button th:if="${session.userType == 'DOCTOR'}" class="btn-action btn-prescription" onclick="showPrescriptionModal()">
            <i class="fas fa-pills"></i> Reçete
          </button>

          <button th:if="${session.userType == 'DOCTOR' and (t.status == 'WAITING' or t.status == null)}" class="btn-action btn-complete" th:onclick="'completeTriage(' + ${t.id} + ')'">
            <i class="fas fa-check"></i> Tamamla
          </button>

          <a th:if="${session.userType == 'SECRETARY'}" th:href="@{'/triage/edit/' + ${t.id}}" class="btn-action btn-edit">
            <i class="fas fa-edit"></i> Düzenle
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function filterTriage(filter) {
    document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
    event.target.closest('.btn-filter').classList.add('active');
    // Filtreleme işlemi yapılabilir
  }

  function completeTriage(id) {
    if(confirm("Bu hastanın muayenesini tamamlandı olarak işaretlemek istiyor musunuz?")) {
      fetch('/triage/api/' + id + '/complete', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' }
      })
              .then(res => {
                if(res.ok) {
                  alert("✅ Muayene başarıyla tamamlandı.");
                  window.location.reload();
                } else {
                  alert("❌ Hata oluştu!");
                }
              });
    }
  }

  function showPrescriptionModal() {
    // Modal göster
    alert("Reçete yazma formu açılacak");
  }
</script>

</body>
</html>
