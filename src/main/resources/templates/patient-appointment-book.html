<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Randevu Oluştur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">
  <style>
    .card { border-radius: 15px; overflow: hidden; }
    .card-header { padding: 20px; }
    .form-select-lg, .flatpickr-input { border-radius: 10px; }
    /* Flatpickr'ın oluşturduğu ikincil inputun tasarımı için */
    .form-control.input { background-color: white !important; }
  </style>
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white text-center">
          <h4 class="mb-0"><i class="fas fa-calendar-plus me-2"></i> Yeni Randevu Planla</h4>
        </div>
        <div class="card-body p-4 p-lg-5 bg-white">

          <form action="/patients/appointments/book" method="post">

            <div class="mb-4" th:if="${session.userType == 'SECRETARY'}">
              <label class="form-label fw-bold text-secondary">Randevu Alınacak Hasta</label>
              <select name="patientId" class="form-select form-select-lg shadow-sm" required>
                <option value="" selected disabled>-- Hasta Seçiniz --</option>
                <option th:each="p : ${allPatients}"
                        th:value="${p.id}"
                        th:text="${p.tcNo + ' - ' + p.firstName + ' ' + p.lastName}"></option>
              </select>
            </div>

            <div class="row mb-4">
              <div class="col-md-6 mb-3 mb-md-0">
                <label class="form-label fw-bold text-secondary">Poliklinik / Bölüm</label>
                <select id="departmentSelect" class="form-select shadow-sm" onchange="filterDoctors()" required>
                  <option value="" selected disabled>-- Bölüm Seçin --</option>
                  <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}"></option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold text-secondary">Doktor</label>
                <select name="doctorId" id="doctorSelect" class="form-select shadow-sm" disabled required>
                  <option value="" selected disabled>-- Önce Bölüm Seçiniz --</option>
                  <option th:each="doc : ${doctors}"
                          th:value="${doc.id}"
                          th:data-dept="${doc.specialization}"
                          th:text="${'Dr. ' + doc.firstName + ' ' + doc.lastName}"></option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold text-secondary">Randevu Tarihi ve Saati</label>
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-white"><i class="fas fa-clock text-primary"></i></span>
                <input type="text" id="smartDatePicker" name="appointmentDate"
                       class="form-control bg-white" placeholder="Tarih seçmek için tıklayın..." required>
              </div>
              <div class="form-text mt-2 text-muted">
                <i class="fas fa-info-circle me-1"></i> 09:00 - 17:00 arası 30 dakikalık dilimler seçilebilir.
              </div>
            </div>

            <hr class="my-4">

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success btn-lg shadow">
                <i class="fas fa-check-circle me-2"></i> Randevuyu Onayla ve Kaydet
              </button>
              <a href="/dashboard" class="btn btn-link text-secondary text-decoration-none">Vazgeç ve Geri Dön</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/tr.js"></script>

<script>
  function filterDoctors() {
    const selectedDept = document.getElementById("departmentSelect").value;
    const doctorSelect = document.getElementById("doctorSelect");
    const options = doctorSelect.getElementsByTagName("option");
    doctorSelect.disabled = false;
    doctorSelect.value = "";
    for (let i = 0; i < options.length; i++) {
      const option = options[i];
      const doctorDept = option.getAttribute("data-dept");
      if (!doctorDept) continue;
      option.style.display = (doctorDept === selectedDept) ? "block" : "none";
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    flatpickr("#smartDatePicker", {
      enableTime: true,
      // 'T' harfi Java'nın LocalDateTime parse hatasını çözer
      dateFormat: "Y-m-dTH:i",
      // altInput: Kullanıcının ekranda daha düzgün bir format görmesini sağlar
      altInput: true,
      altFormat: "d.m.Y H:i",
      minDate: "today",
      time_24hr: true,
      locale: "tr",
      minuteIncrement: 30,
      minTime: "09:00",
      maxTime: "17:00"
    });
  });
</script>

</body>
</html>
