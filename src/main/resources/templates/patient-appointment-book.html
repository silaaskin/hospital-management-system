<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Randevu Planla - MHRS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
        --mhrs-primary: #0d6efd;
        --mhrs-success: #28a745;
        --mhrs-info: #17a2b8;
        --mhrs-danger: #dc3545;
        --mhrs-teal: #20c997;
    }

    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 30px 15px;
    }

    .appointment-container {
        max-width: 1000px;
        margin: 0 auto;
    }

    .appointment-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        overflow: hidden;
        animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card-header-custom {
        background: linear-gradient(135deg, var(--mhrs-primary) 0%, var(--mhrs-info) 100%);
        color: white;
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .card-header-custom::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 300px;
        height: 300px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
    }

    .card-header-custom h4 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        position: relative;
        z-index: 1;
    }

    .card-body-custom {
        padding: 40px 35px;
    }

    .step-section {
        margin-bottom: 35px;
        padding: 25px;
        background: #f8f9fa;
        border-radius: 15px;
        border-left: 5px solid var(--mhrs-primary);
        animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .step-label {
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 15px;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .step-number {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--mhrs-primary) 0%, var(--mhrs-info) 100%);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
    }

    .form-select-custom,
    .form-control-custom {
        border: 2px solid #e9ecef;
        border-radius: 12px;
        padding: 15px 18px;
        font-size: 15px;
        transition: all 0.3s;
        background: white;
    }

    .form-select-custom:focus,
    .form-control-custom:focus {
        border-color: var(--mhrs-primary);
        box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
    }

    .form-text-custom {
        color: #6c757d;
        font-size: 13px;
        margin-top: 8px;
    }

    /* Days Scroll */
    .days-scroll {
        display: flex;
        overflow-x: auto;
        padding: 15px 0;
        gap: 12px;
        scroll-behavior: smooth;
    }

    .days-scroll::-webkit-scrollbar {
        height: 8px;
    }

    .days-scroll::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
    }

    .days-scroll::-webkit-scrollbar-thumb {
        background: var(--mhrs-primary);
        border-radius: 10px;
    }

    .day-btn {
        min-width: 140px;
        padding: 15px 20px;
        background: white;
        border: 2px solid #e9ecef;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s;
        text-align: center;
        flex-shrink: 0;
    }

    .day-btn:hover {
        border-color: var(--mhrs-primary);
        transform: translateY(-3px);
        box-shadow: 0 4px 15px rgba(13,110,253,0.2);
    }

    .day-btn.selected-item {
        background: linear-gradient(135deg, var(--mhrs-primary) 0%, var(--mhrs-info) 100%);
        color: white;
        border-color: var(--mhrs-primary);
        box-shadow: 0 6px 20px rgba(13,110,253,0.3);
    }

    .day-btn strong {
        display: block;
        font-size: 14px;
        margin-bottom: 5px;
    }

    .day-btn span {
        font-size: 16px;
        font-weight: 700;
    }

    /* Time Slots */
    .slots-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 20px;
        background: white;
        border: 2px solid #e9ecef;
        border-radius: 12px;
    }

    .slot-btn {
        width: calc(20% - 8px);
        min-width: 95px;
        padding: 12px 8px;
        background: white;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s;
        color: #2c3e50;
    }

    .slot-btn:hover:not(.busy-slot) {
        border-color: var(--mhrs-success);
        background: #f0fff4;
        transform: translateY(-2px);
    }

    .slot-btn.selected-item {
        background: linear-gradient(135deg, var(--mhrs-success) 0%, var(--mhrs-teal) 100%);
        color: white;
        border-color: var(--mhrs-success);
        box-shadow: 0 4px 15px rgba(40,167,69,0.3);
    }

    .slot-btn.busy-slot {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
        opacity: 0.7;
        cursor: not-allowed;
        border-color: #f5c6cb;
    }

    /* Submit Button */
    .btn-submit {
        background: linear-gradient(135deg, var(--mhrs-success) 0%, var(--mhrs-teal) 100%);
        color: white;
        border: none;
        padding: 18px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(40,167,69,0.3);
    }

    .btn-submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(40,167,69,0.4);
    }

    .btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .card-body-custom {
            padding: 30px 20px;
        }

        .slot-btn {
            width: calc(33.333% - 7px);
            min-width: 80px;
        }

        .day-btn {
            min-width: 120px;
        }
    }

    @media (max-width: 480px) {
        .slot-btn {
            width: calc(50% - 5px);
        }
    }
  </style>
</head>
<body>

<div class="appointment-container">
  <div class="appointment-card">
    <div class="card-header-custom">
      <h4>
        <i class="fas fa-hospital-user me-2"></i>
        Akıllı Randevu Sistemi
      </h4>
    </div>

    <div class="card-body-custom">
      <form action="/patients/appointments/book" method="post">

        <div th:if="${session.userType == 'SECRETARY'}" class="step-section">
          <label class="step-label">
            <span class="step-number">0</span>
            <i class="fas fa-user-injured"></i>
            Randevu Alınacak Hasta
          </label>
          <select name="patientId" class="form-select form-select-custom" required>
            <option value="" selected disabled>-- Listeden Hasta Seçiniz --</option>
            <option th:each="p : ${allPatients}"
                    th:value="${p.id}"
                    th:text="${p.firstName + ' ' + p.lastName + ' (TC: ' + p.tcNo + ')'}">
            </option>
          </select>
          <div class="form-text-custom">
            <i class="fas fa-info-circle me-1"></i>
            Lütfen randevu kaydı yapılacak hastayı seçin
          </div>
        </div>

        <div class="step-section">
          <label class="step-label">
            <span class="step-number">1</span>
            <i class="fas fa-stethoscope"></i>
            Poliklinik Seçiniz
          </label>
          <select id="departmentSelect" class="form-select form-select-custom" onchange="filterDoctorsByDept()" required>
            <option value="" selected disabled>-- Branş Seçiniz --</option>
            <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}"></option>
          </select>
        </div>

        <div id="doctorArea" class="step-section d-none">
          <label class="step-label">
            <span class="step-number">2</span>
            <i class="fas fa-user-md"></i>
            Doktor Seçiniz
          </label>
          <select name="doctorId" id="doctorSelect" class="form-select form-select-custom" onchange="showDays()" required>
            <option value="" selected disabled>-- Önce Branş Seçiniz --</option>
            <option th:each="doc : ${doctors}"
                    th:value="${doc.id}"
                    th:data-dept="${doc.specialization}"
                    th:text="${'Dr. ' + doc.firstName + ' ' + doc.lastName}"></option>
          </select>
        </div>

        <div id="dayArea" class="step-section d-none">
          <label class="step-label">
            <span class="step-number">3</span>
            <i class="fas fa-calendar-day"></i>
            Tarih Seçiniz
          </label>
          <div id="daysList" class="days-scroll"></div>
          <input type="hidden" id="selectedDate">
        </div>

        <div id="timeArea" class="step-section d-none">
          <label class="step-label">
            <span class="step-number">4</span>
            <i class="fas fa-clock"></i>
            Saat Dilimi Seçiniz
          </label>
          <div id="slotsContainer" class="slots-container"></div>
          <input type="hidden" id="finalDateTime" name="appointmentDate" required>
          <div class="form-text-custom mt-3">
            <i class="fas fa-info-circle me-1"></i>
            Gri renkli saatler doludur, yeşil olanlardan seçim yapabilirsiniz
          </div>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" id="submitBtn" class="btn-submit" disabled>
            <i class="fas fa-check-circle me-2"></i>
            Randevuyu Tamamla
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const timeSlots = ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30"];

  function filterDoctorsByDept() {
      const dept = document.getElementById('departmentSelect').value;
      const docSelect = document.getElementById('doctorSelect');
      const options = docSelect.getElementsByTagName('option');

      document.getElementById('doctorArea').classList.remove('d-none');
      docSelect.value = "";
      document.getElementById('dayArea').classList.add('d-none');
      document.getElementById('timeArea').classList.add('d-none');
      document.getElementById('submitBtn').disabled = true;

      for (let opt of options) {
          if (!opt.getAttribute('data-dept')) continue;
          opt.style.display = (opt.getAttribute('data-dept') === dept) ? "block" : "none";
      }
  }

  function showDays() {
      const daysList = document.getElementById('daysList');
      daysList.innerHTML = '';
      document.getElementById('dayArea').classList.remove('d-none');
      document.getElementById('timeArea').classList.add('d-none');
      document.getElementById('submitBtn').disabled = true;

      for (let i = 1; i <= 10; i++) {
          let d = new Date();
          d.setDate(d.getDate() + i);
          let dateStr = d.toISOString().split('T')[0];

          let btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'day-btn';
          btn.innerHTML = `
              <strong>${d.toLocaleDateString('tr-TR', {weekday: 'short'})}</strong>
              <span>${d.toLocaleDateString('tr-TR', {day:'2-digit', month:'2-digit'})}</span>
          `;
          btn.onclick = () => selectDay(dateStr, btn);
          daysList.appendChild(btn);
      }
  }

  function selectDay(date, btn) {
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected-item'));
      btn.classList.add('selected-item');
      document.getElementById('selectedDate').value = date;
      document.getElementById('submitBtn').disabled = true;

      const docId = document.getElementById('doctorSelect').value;

      fetch(`/appointments/api/busy-slots?doctorId=${docId}&date=${date}`)
          .then(res => res.json())
          .then(busySlots => renderTimeSlots(busySlots, date));
  }

  function renderTimeSlots(busySlots, date) {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      document.getElementById('timeArea').classList.remove('d-none');

      timeSlots.forEach(s => {
          const isBusy = busySlots.some(b => b.startsWith(s));
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `slot-btn ${isBusy ? 'busy-slot' : ''}`;
          btn.innerText = s;

          if (!isBusy) {
              btn.onclick = () => {
                  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected-item'));
                  btn.classList.add('selected-item');
                  document.getElementById('finalDateTime').value = date + 'T' + s + ':00';
                  document.getElementById('submitBtn').disabled = false;
              };
          } else {
              btn.disabled = true;
          }
          container.appendChild(btn);
      });
  }
</script>

</body>
</html>
