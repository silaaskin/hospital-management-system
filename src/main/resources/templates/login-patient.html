<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hasta Girişi</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #e9ecef; font-family: sans-serif; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }
    button:hover { background: #218838; }
    .error { color: red; margin-top: 10px; font-size: 14px; }
    .hint { font-size: 12px; color: #666; display: block; margin-bottom: 5px; text-align: left; }
  </style>
</head>
<body>
<div class="login-box">
  <h2>Hasta Girişi</h2>
  <form id="patForm">
    <input type="text" id="tcNo" placeholder="TC Kimlik Numaranız" required maxlength="11">

    <input type="password" id="password" placeholder="Şifreniz" required>
    <span class="hint">ℹ️ Şifreniz: Telefon numaranızın son 4 hanesi + TC'nizin ilk 4 hanesidir.</span>

    <button type="submit">Giriş Yap</button>
  </form>
  <div id="msg" class="error"></div>
</div>

<script>
  document.getElementById('patForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const tcNo = document.getElementById('tcNo').value;
    const password = document.getElementById('password').value; // Şifreyi alıyoruz

    // Sunucuya hem TC hem Şifre gönderiyoruz
    fetch('/patients/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        tcNo: tcNo,
        password: password
      })
    })
            .then(async res => {
              // Eğer giriş başarılıysa (HTTP 200)
              if (res.ok) {
                return res.json().then(data => {
                  window.location.href = '/dashboard';
                });
              }
              // Eğer hata varsa (HTTP 401 vs), backend'den gelen mesajı al (Text olarak)
              else {
                const errorMsg = await res.text();
                document.getElementById('msg').innerText = errorMsg || "Giriş başarısız!";
              }
            })
            .catch(err => {
              console.error(err);
              document.getElementById('msg').innerText = "Bağlantı hatası oluştu.";
            });
  });
</script>
</body>
</html>
