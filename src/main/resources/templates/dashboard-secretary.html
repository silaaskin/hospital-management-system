<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sekreter Paneli</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center p-5">
<div class="container">
  <h1 class="text-primary">Hoş Geldiniz, <span th:text="${userName}"></span></h1>
  <p class="lead">Tıbbi Sekreter Paneli</p>
  <hr class="my-4">

  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">👤 Hasta İşlemleri</h5>
          <p class="card-text">Yeni hasta kaydı oluştur veya listele.</p>
          <a href="/patients/view" class="btn btn-primary w-100">Hasta Yönetimi</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">📅 Randevu Oluştur</h5>
          <p class="card-text">Doktorlar adına randevu planla.</p>
          <a href="#" class="btn btn-secondary w-100 disabled">Çok Yakında</a>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-5">
    <a href="/logout" class="btn btn-danger">Güvenli Çıkış</a>
  </div>
</div>
</body>
</html>
