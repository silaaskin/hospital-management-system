<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Yeni Hasta Kaydı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%); min-height: 100vh; padding: 40px 20px; }
    .navbar-custom { background: linear-gradient(90deg, #1e40af 0%, #0f3460 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 40px; }
    .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
    .container-wrapper { max-width: 750px; margin: 0 auto; }
    .form-card { background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
    .form-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; text-align: center; }
    .form-header h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; }
    .form-header p { opacity: 0.9; margin-bottom: 0; }
    .form-body { padding: 40px; }
    .section-title { font-size: 1.1rem; font-weight: 600; color: #1e40af; margin-top: 30px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #e5e7eb; }
    .section-title:first-of-type { margin-top: 0; }
    .form-group { margin-bottom: 20px; }
    .form-label { font-weight: 600; color: #1f2937; margin-bottom: 8px; display: block; }
    .form-control, .form-select { padding: 12px 15px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 0.95rem; transition: all 0.3s; }
    .form-control:focus, .form-select:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); outline: none; }
    .form-control::placeholder { color: #9ca3af; }
    .form-text { color: #6b7280; font-size: 0.85rem; margin-top: 5px; }
    .row-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .row-group.full { grid-template-columns: 1fr; }
    .button-group { display: flex; gap: 15px; margin-top: 40px; }
    .btn-submit { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 14px 40px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); color: white; }
    .btn-cancel { background: #e5e7eb; color: #374151; padding: 14px 40px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
    .btn-cancel:hover { background: #d1d5db; color: #374151; }
    .input-icon { position: relative; }
    .input-icon i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #9ca3af; pointer-events: none; }
    .input-icon input, .input-icon .form-control { padding-left: 40px; }
    .required { color: #dc2626; }
    .success-message { display: none; }
    .success-message.show { display: block; }
    @media (max-width: 768px) {
      .form-header { padding: 30px; }
      .form-body { padding: 25px; }
      .row-group { grid-template-columns: 1fr; }
      .button-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
  </div>
</nav>

<div class="container-wrapper">
  <div class="form-card">
    <div class="form-header">
      <h2><i class="fas fa-user-plus"></i> Yeni Hasta Kaydı</h2>
      <p>Tam kapsamlı hasta bilgilerini girin</p>
    </div>

    <div class="form-body">
      <form id="addPatientForm">
        <!-- KİŞİSEL BİLGİLER -->
        <div class="section-title"><i class="fas fa-id-card"></i> Kişisel Bilgiler</div>

        <div class="row-group">
          <div class="form-group">
            <label class="form-label">Ad <span class="required">*</span></label>
            <div class="input-icon">
              <i class="fas fa-user"></i>
              <input type="text" id="firstName" class="form-control" placeholder="Hastanın adı" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Soyad <span class="required">*</span></label>
            <div class="input-icon">
              <i class="fas fa-user"></i>
              <input type="text" id="lastName" class="form-control" placeholder="Hastanın soyadı" required>
            </div>
          </div>
        </div>

        <div class="row-group">
          <div class="form-group">
            <label class="form-label">TC Kimlik No <span class="required">*</span></label>
            <div class="input-icon">
              <i class="fas fa-id-card"></i>
              <input type="text" id="tcNo" class="form-control" placeholder="11 haneli TC no" maxlength="11" minlength="11" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Doğum Tarihi</label>
            <div class="input-icon">
              <i class="fas fa-calendar"></i>
              <input type="date" id="birthDate" class="form-control">
            </div>
          </div>
        </div>

        <!-- İLETİŞİM BİLGİLERİ -->
        <div class="section-title"><i class="fas fa-phone"></i> İletişim Bilgileri</div>

        <div class="row-group">
          <div class="form-group">
            <label class="form-label">Telefon (10 Hane) <span class="required">*</span></label>
            <div class="input-icon">
              <i class="fas fa-phone"></i>
              <input type="text" id="phone" class="form-control" placeholder="5XXXXXXXXX" maxlength="10" minlength="10" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">E-Posta <span class="required">*</span></label>
            <div class="input-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" id="email" class="form-control" placeholder="hasta@example.com" required>
            </div>
          </div>
        </div>

        <!-- SAĞLIK BİLGİLERİ -->
        <div class="section-title"><i class="fas fa-heartbeat"></i> Sağlık Bilgileri</div>

        <div class="row-group">
          <div class="form-group">
            <label class="form-label">Kan Grubu <span class="required">*</span></label>
            <select id="bloodType" class="form-select" required>
              <option value="">Kan Grubu Seçiniz</option>
              <option value="A+">A Rh+ (Pozitif)</option>
              <option value="A-">A Rh- (Negatif)</option>
              <option value="B+">B Rh+ (Pozitif)</option>
              <option value="B-">B Rh- (Negatif)</option>
              <option value="AB+">AB Rh+ (Pozitif)</option>
              <option value="AB-">AB Rh- (Negatif)</option>
              <option value="0+">0 Rh+ (Pozitif)</option>
              <option value="0-">0 Rh- (Negatif)</option>
            </select>
          </div>
        </div>

        <div class="form-group row-group full">
          <label class="form-label">Adres</label>
          <textarea id="address" class="form-control" rows="3" placeholder="Hastanın tam adresi..."></textarea>
        </div>

        <!-- BUTONLAR -->
        <div class="button-group">
          <button type="submit" class="btn-submit">
            <i class="fas fa-save"></i> Hasta Kaydını Oluştur
          </button>
          <a href="/patients/view" class="btn-cancel">
            <i class="fas fa-times"></i> İptal Et
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('addPatientForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const patientData = {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      tcNo: document.getElementById('tcNo').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      address: document.getElementById('address').value,
      bloodType: document.getElementById('bloodType').value,
      birthDate: document.getElementById('birthDate').value || null
    };

    fetch('/patients/api', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(patientData)
    }).then(async response => {
      if(response.ok) {
        alert("✅ Hasta başarıyla kaydedildi!");
        window.location.href = "/patients/view";
      } else {
        const msg = await response.text();
        alert("❌ Hata: " + msg);
      }
    }).catch(err => {
      alert("❌ Bağlantı hatası: " + err.message);
    });
  });
</script>

</body>
</html>
