<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeni Hasta Kaydı - MHRS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
        --mhrs-primary: #0d6efd;
        --mhrs-success: #28a745;
        --mhrs-info: #17a2b8;
        --mhrs-danger: #dc3545;
    }

    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 30px 15px;
    }

    .main-container {
        max-width: 900px;
        margin: 0 auto;
    }

    .form-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        overflow: hidden;
        animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-header {
        background: linear-gradient(135deg, var(--mhrs-primary) 0%, var(--mhrs-info) 100%);
        color: white;
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .form-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 300px;
        height: 300px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
    }

    .form-header h4 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        position: relative;
        z-index: 1;
    }

    .form-header i {
        font-size: 20px;
        margin-right: 10px;
    }

    .form-body {
        padding: 40px 35px;
    }

    .section-title {
        color: var(--mhrs-primary);
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 3px solid #e9ecef;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .section-title i {
        font-size: 22px;
    }

    .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .required-star {
        color: var(--mhrs-danger);
        margin-left: 3px;
    }

    .form-control,
    .form-select {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 12px 15px;
        font-size: 15px;
        transition: all 0.3s;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: var(--mhrs-primary);
        box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
    }

    .form-control::placeholder {
        color: #adb5bd;
    }

    textarea.form-control {
        resize: vertical;
        min-height: 80px;
    }

    .input-group-icon {
        position: relative;
    }

    .input-group-icon .form-control {
        padding-left: 45px;
    }

    .input-group-icon i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #6c757d;
        font-size: 16px;
        z-index: 10;
    }

    .form-text {
        color: #6c757d;
        font-size: 12px;
        margin-top: 5px;
    }

    .section-divider {
        border: 0;
        border-top: 2px solid #e9ecef;
        margin: 30px 0;
    }

    .btn-submit {
        background: linear-gradient(135deg, var(--mhrs-success) 0%, #20c997 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(40,167,69,0.3);
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(40,167,69,0.4);
        color: white;
    }

    .btn-cancel {
        background: #6c757d;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }

    .btn-cancel:hover {
        background: #5a6268;
        transform: translateY(-2px);
        color: white;
        text-decoration: none;
    }

    /* Loading Spinner */
    .spinner-border-sm {
        width: 20px;
        height: 20px;
        border-width: 2px;
    }

    .btn-submit.loading {
        position: relative;
        color: transparent;
    }

    .btn-submit.loading::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        top: 50%;
        left: 50%;
        margin-left: -10px;
        margin-top: -10px;
        border: 3px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
        .form-body {
            padding: 30px 20px;
        }

        .form-header h4 {
            font-size: 22px;
        }

        .section-title {
            font-size: 16px;
        }
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="form-card">
    <div class="form-header">
      <h4>
        <i class="fas fa-user-plus"></i>
        Tam Kapsamlı Hasta Kaydı
      </h4>
    </div>

    <div class="form-body">
      <form id="addPatientForm">
        <div class="section-title">
          <i class="fas fa-id-card"></i>
          Kişisel Bilgiler
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">
              Ad <span class="required-star">*</span>
            </label>
            <div class="input-group-icon">
              <i class="fas fa-user"></i>
              <input type="text"
                     id="firstName"
                     class="form-control"
                     placeholder="Adınızı girin"
                     required>
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">
              Soyad <span class="required-star">*</span>
            </label>
            <div class="input-group-icon">
              <i class="fas fa-user"></i>
              <input type="text"
                     id="lastName"
                     class="form-control"
                     placeholder="Soyadınızı girin"
                     required>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">
              TC Kimlik No <span class="required-star">*</span>
            </label>
            <div class="input-group-icon">
              <i class="fas fa-id-card-alt"></i>
              <input type="text"
                     id="tcNo"
                     class="form-control"
                     placeholder="11 haneli TC No"
                     maxlength="11"
                     minlength="11"
                     pattern="[0-9]{11}"
                     required>
            </div>
            <div class="form-text">TC Kimlik numarası 11 haneli olmalıdır</div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Doğum Tarihi</label>
            <div class="input-group-icon">
              <i class="fas fa-calendar"></i>
              <input type="date"
                     id="birthDate"
                     class="form-control">
            </div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="section-title">
          <i class="fas fa-phone"></i>
          İletişim ve Sağlık Bilgileri
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">
              Telefon <span class="required-star">*</span>
            </label>
            <div class="input-group-icon">
              <i class="fas fa-mobile-alt"></i>
              <input type="text"
                     id="phone"
                     class="form-control"
                     placeholder="5XXXXXXXXX"
                     maxlength="10"
                     minlength="10"
                     pattern="[0-9]{10}"
                     required>
            </div>
            <div class="form-text">Başında 0 olmadan 10 hane (Örn: 5551234567)</div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">
              E-Posta <span class="required-star">*</span>
            </label>
            <div class="input-group-icon">
              <i class="fas fa-envelope"></i>
              <input type="email"
                     id="email"
                     class="form-control"
                     placeholder="ornek@email.com"
                     required>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">
              Kan Grubu <span class="required-star">*</span>
            </label>
            <select id="bloodType" class="form-select" required>
              <option value="">Seçiniz</option>
              <option value="A+">A Rh+</option>
              <option value="A-">A Rh-</option>
              <option value="B+">B Rh+</option>
              <option value="B-">B Rh-</option>
              <option value="AB+">AB Rh+</option>
              <option value="AB-">AB Rh-</option>
              <option value="0+">0 Rh+</option>
              <option value="0-">0 Rh-</option>
            </select>
          </div>

          <div class="col-md-8 mb-3">
            <label class="form-label">Adres</label>
            <div class="input-group-icon">
              <i class="fas fa-map-marker-alt"></i>
              <textarea id="address"
                        class="form-control"
                        placeholder="Adres bilgisi girin..."
                        rows="2"></textarea>
            </div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="d-grid gap-3 mt-4">
          <button type="submit" class="btn btn-submit" id="submitBtn">
            <i class="fas fa-check-circle me-2"></i>
            Kaydet
          </button>
          <a href="/patients/view" class="btn-cancel">
            <i class="fas fa-times-circle me-2"></i>
            İptal
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('tcNo').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
  });

  document.getElementById('phone').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
  });

  document.getElementById('addPatientForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      const patientData = {
          firstName: document.getElementById('firstName').value.trim(),
          lastName: document.getElementById('lastName').value.trim(),
          tcNo: document.getElementById('tcNo').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          email: document.getElementById('email').value.trim(),
          address: document.getElementById('address').value.trim() || null,
          bloodType: document.getElementById('bloodType').value,
          birthDate: document.getElementById('birthDate').value || null
      };


      if (patientData.tcNo.length !== 11) {
          alert('❌ TC Kimlik numarası 11 haneli olmalıdır!');
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          return;
      }

      if (patientData.phone.length !== 10) {
          alert('❌ Telefon numarası 10 haneli olmalıdır!');
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          return;
      }

      fetch('/patients/api', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(patientData)
      })
      .then(async response => {
          if(response.ok) {
              submitBtn.innerHTML = '<i class="fas fa-check-circle me-2"></i> Başarılı!';
              submitBtn.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';

              setTimeout(() => {
                  alert("✅ Hasta başarıyla kaydedildi!");
                  window.location.href = "/patients/view";
              }, 500);
          } else {
              const msg = await response.text();
              throw new Error(msg || 'Kayıt işlemi başarısız!');
          }
      })
      .catch(error => {
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          alert("❌ Hata: " + error.message);
      });
  });
</script>

</body>
</html>
