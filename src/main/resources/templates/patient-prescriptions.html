<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reçetelerim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; min-height: 100vh; }
    .navbar-custom { background: linear-gradient(90deg, #1e40af 0%, #0f3460 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
    .page-header { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 40px 0; margin-bottom: 40px; }
    .page-header h2 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; }
    .page-header p { opacity: 0.9; margin-bottom: 0; }
    .container-custom { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 15px; flex-wrap: wrap; }
    .btn-back { background: #6b7280; color: white; padding: 12px 25px; border: none; border-radius: 8px; font-weight: 600; text-decoration: none; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-back:hover { background: #4b5563; color: white; }
    .prescription-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; margin-bottom: 40px; }
    .prescription-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; transition: all 0.3s; border-left: 5px solid #f59e0b; }
    .prescription-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .card-header { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .prescription-number { font-weight: 700; font-size: 1.1rem; }
    .prescription-date { font-size: 0.85rem; opacity: 0.9; }
    .card-body { padding: 25px; }
    .doctor-info { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0; }
    .doctor-icon { font-size: 1.8rem; color: #f59e0b; }
    .doctor-name { font-weight: 600; color: #1f2937; font-size: 1.05rem; }
    .prescription-section { margin-bottom: 18px; }
    .section-label { font-weight: 600; color: #6b7280; font-size: 0.85rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .section-content { color: #374151; font-size: 0.95rem; line-height: 1.6; padding: 12px; background: #f9fafb; border-left: 3px solid #f59e0b; border-radius: 4px; }
    .instruction-box { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 12px; margin-top: 15px; }
    .instruction-box strong { color: #92400e; }
    .instruction-box p { margin-bottom: 0; color: #78350f; font-size: 0.9rem; }
    .empty-state { text-align: center; padding: 80px 20px; }
    .empty-state i { font-size: 4rem; color: #d1d5db; margin-bottom: 20px; }
    .empty-state h4 { color: #6b7280; font-weight: 600; margin-bottom: 10px; }
    .empty-state p { color: #9ca3af; }
    @media (max-width: 768px) {
      .page-header h2 { font-size: 1.5rem; }
      .prescription-grid { grid-template-columns: 1fr; }
      .action-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
    <a href="/dashboard" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Panele Dön</a>
  </div>
</nav>

<div class="page-header">
  <div class="container-custom">
    <h2><i class="fas fa-file-prescription"></i> Reçetelerim</h2>
    <p>Doktorlarınızdan aldığınız tüm reçeteler</p>
  </div>
</div>

<div class="container-custom">
  <div th:if="${#lists.isEmpty(prescriptionList)}" class="empty-state">
    <i class="fas fa-clipboard-list"></i>
    <h4>Reçete Kaydı Bulunamadı</h4>
    <p>Henüz adınıza kayıtlı bir reçete bulunmamaktadır.</p>
  </div>

  <div th:if="${!#lists.isEmpty(prescriptionList)}" class="prescription-grid">
    <div th:each="item : ${prescriptionList}" class="prescription-card">
      <div class="card-header">
        <div>
          <div class="prescription-number">#<span th:text="${item.id}"></span></div>
          <div class="prescription-date" th:text="${item.prescriptionDate}"></div>
        </div>
        <i class="fas fa-check-circle" style="font-size: 1.5rem;"></i>
      </div>

      <div class="card-body">
        <div class="doctor-info">
          <div class="doctor-icon"><i class="fas fa-user-md"></i></div>
          <div>
            <div class="section-label">Doktor</div>
            <div class="doctor-name" th:text="${'Dr. ' + item.doctor.firstName + ' ' + item.doctor.lastName}"></div>
          </div>
        </div>

        <div class="prescription-section">
          <div class="section-label"><i class="fas fa-capsules"></i> İlaçlar</div>
          <div class="section-content" th:text="${item.medications}"></div>
        </div>

        <div class="prescription-section" th:if="${item.dosage}">
          <div class="section-label"><i class="fas fa-prescription-bottle"></i> Kullanım Şekli</div>
          <div class="section-content" th:text="${item.dosage}"></div>
        </div>

        <div class="prescription-section" th:if="${item.instructions}">
          <div class="section-label"><i class="fas fa-info-circle"></i> Talimatlar</div>
          <div class="instruction-box">
            <p th:text="${item.instructions}"></p>
          </div>
        </div>

        <div class="prescription-section" th:if="${item.notes}">
          <div class="section-label"><i class="fas fa-sticky-note"></i> Doktor Notu</div>
          <div class="section-content" th:text="${item.notes}"></div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
