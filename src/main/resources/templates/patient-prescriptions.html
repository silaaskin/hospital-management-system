<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Reçetelerim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary"><i class="fas fa-file-medical"></i> Reçetelerim</h3>
    <a href="/dashboard" class="btn btn-outline-secondary">
      <i class="fas fa-arrow-left"></i> Panele Dön
    </a>
  </div>

  <div th:if="${#lists.isEmpty(prescriptionList)}" class="alert alert-warning shadow-sm">
    <i class="fas fa-info-circle"></i> Henüz adınıza kayıtlı bir reçete bulunmamaktadır.
  </div>

  <div class="row">
    <div class="col-md-6 mb-4" th:each="item : ${prescriptionList}">
      <div class="card shadow h-100 border-0">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <span class="badge bg-primary">Reçete #<span th:text="${item.id}"></span></span>
          <small class="text-muted" th:text="${item.prescriptionDate}"></small>
        </div>

        <div class="card-body">
          <h5 class="card-title text-dark">
            <i class="fas fa-user-md text-primary"></i>
            <span th:text="${item.doctor.firstName + ' ' + item.doctor.lastName}"></span>
          </h5>

          <hr>

          <p class="mb-2">
            <strong><i class="fas fa-capsules text-success"></i> İlaçlar:</strong><br>
            <span th:text="${item.medications}"></span>
          </p>

          <p class="mb-2" th:if="${item.dosage}">
            <strong><i class="fas fa-prescription-bottle"></i> Dozaj:</strong>
            <span th:text="${item.dosage}"></span>
          </p>

          <p class="mb-2" th:if="${item.instructions}">
            <strong><i class="fas fa-info-circle"></i> Talimat:</strong>
            <span class="fst-italic text-muted" th:text="${item.instructions}"></span>
          </p>

        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
