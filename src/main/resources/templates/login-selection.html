<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Giriş Seçimi</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f0f2f5; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    .btn { display: inline-block; padding: 15px 30px; margin: 10px; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
    .btn-doc { background-color: #007bff; }
    .btn-pat { background-color: #28a745; }
    .btn:hover { opacity: 0.9; transform: scale(1.05); }
  </style>
</head>
<body>
<div class="card">
  <h1>Hastane Yönetim Sistemi</h1>
  <p>Lütfen giriş yapmak istediğiniz rolü seçin:</p>
  <div>
    <a href="/doctors/login" class="btn btn-doc">👨‍⚕️ Doktor Girişi</a>
    <a href="/patients/login" class="btn btn-pat">👤 Hasta Girişi</a>
    <a href="/secretaries/login" class="btn" style="background-color: #6f42c1; color: white;">📝 Sekreter Girişi</a>
  </div>
</div>
</body>
</html>
