<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hastane Yönetim Sistemi - Giriş</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 1100px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #1e40af 0%, #0f3460 100%);
      color: white;
      padding: 50px 30px;
      text-align: center;
    }
    .login-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .login-header i {
      font-size: 3rem;
      margin-bottom: 15px;
      display: block;
    }
    .login-header p {
      font-size: 1.1rem;
      opacity: 0.95;
    }
    .login-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 60px 40px;
    }
    .login-option {
      background: white;
      border: 2px solid #f0f0f0;
      border-radius: 15px;
      padding: 40px 25px;
      text-align: center;
      text-decoration: none;
      color: #333;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .login-option::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #1e40af, #0f3460);
    }
    .login-option:nth-child(2)::before {
      background: linear-gradient(90deg, #047857, #065f46);
    }
    .login-option:nth-child(3)::before {
      background: linear-gradient(90deg, #6d28d9, #5b21b6);
    }
    .login-option:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      border-color: #ddd;
    }
    .option-icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #1e40af, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-option:nth-child(2) .option-icon {
      background: linear-gradient(135deg, #047857, #065f46);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-option:nth-child(3) .option-icon {
      background: linear-gradient(135deg, #6d28d9, #5b21b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .option-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #1f2937;
    }
    .option-desc {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .option-btn {
      display: inline-block;
      padding: 12px 35px;
      background: linear-gradient(135deg, #1e40af, #0f3460);
      color: white;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
      border: none;
      cursor: pointer;
    }
    .login-option:nth-child(2) .option-btn {
      background: linear-gradient(135deg, #047857, #065f46);
    }
    .login-option:nth-child(3) .option-btn {
      background: linear-gradient(135deg, #6d28d9, #5b21b6);
    }
    .option-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    @media (max-width: 768px) {
      .login-header { padding: 40px 20px; }
      .login-header h1 { font-size: 1.8rem; }
      .login-options {
        grid-template-columns: 1fr;
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <i class="fas fa-hospital"></i>
    <h1>Hastane Yönetim Sistemi</h1>
    <p>Modern Sağlık Hizmetleri Yönetim Platformu</p>
  </div>

  <div class="login-options">
    <a href="/doctors/login" class="login-option">
      <div class="option-icon"><i class="fas fa-stethoscope"></i></div>
      <div class="option-title">Doktor Girişi</div>
      <div class="option-desc">Doktor hesabınızla giriş yapın ve randevularınızı yönetin</div>
      <button class="option-btn">Giriş Yap</button>
    </a>

    <a href="/patients/login" class="login-option">
      <div class="option-icon"><i class="fas fa-user-injured"></i></div>
      <div class="option-title">Hasta Girişi</div>
      <div class="option-desc">Hasta hesabınızla giriş yapın ve randevularınızı takip edin</div>
      <button class="option-btn">Giriş Yap</button>
    </a>

    <a href="/secretaries/login" class="login-option">
      <div class="option-icon"><i class="fas fa-clipboard-list"></i></div>
      <div class="option-title">Sekreter Girişi</div>
      <div class="option-desc">Sekreter hesabınızla giriş yapın ve işlemleri yönetin</div>
      <button class="option-btn">Giriş Yap</button>
    </a>
  </div>
</div>

</body>
</html>
