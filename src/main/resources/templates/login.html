<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hastane Yönetim Sistemi | Giriş</title>
  <style>
    /* Modern ve Temiz Bir Tasarım İçin CSS */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-card h2 {
      margin-bottom: 1.5rem;
      color: #343a40;
    }
    .form-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #6c757d;
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box; /* Padding taşmasını engeller */
      transition: border-color 0.3s;
    }
    .form-control:focus {
      border-color: #007bff;
      outline: none;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }
    .btn-login:hover {
      background-color: #0056b3;
    }
    .error-message {
      color: #dc3545;
      background-color: #f8d7da;
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
      font-size: 0.9rem;
      display: none; /* Başlangıçta gizli */
    }
    .footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #adb5bd;
    }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Sistem Girişi</h2>

  <form id="loginForm">
    <div class="form-group">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" class="form-control" placeholder="Doktor ID veya Kullanıcı Adı" required>
    </div>

    <div class="form-group">
      <label for="password">Şifre</label>
      <input type="password" id="password" class="form-control" placeholder="Şifreniz" required>
    </div>

    <button type="submit" class="btn-login">Giriş Yap</button>
  </form>

  <div id="errorMessage" class="error-message"></div>

  <div class="footer">
    &copy; 2025 Hastane Yönetim Sistemi
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Sayfanın yenilenmesini durdur

    // Inputlardaki değerleri al
    const usernameVal = document.getElementById('username').value;
    const passwordVal = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');

    // Hata mesajını temizle
    errorDiv.style.display = 'none';
    errorDiv.innerText = '';

    // Backend'e istek at (DoctorController -> login metodu)
    fetch('/doctors/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      // Veriyi JSON formatına çevirip gönderiyoruz
      body: JSON.stringify({
        username: usernameVal,
        password: passwordVal
      })
    })
            .then(response => {
              if (response.ok) {
                return response.json();
              } else {
                // 401 Unauthorized gelirse burası çalışır
                throw new Error("Giriş bilgileri hatalı!");
              }
            })
            .then(data => {
              if (data.success) {
                // BAŞARILI: Dashboard'a yönlendir
                window.location.href = '/dashboard';
              } else {
                // BAŞARISIZ: Backend'den gelen mesajı göster
                errorDiv.innerText = data.message || "Giriş başarısız.";
                errorDiv.style.display = 'block';
              }
            })
            .catch(error => {
              // Sunucu hatası veya bağlantı sorunu
              errorDiv.innerText = "Giriş başarısız! Kullanıcı adı veya şifre yanlış.";
              errorDiv.style.display = 'block';
              console.error('Hata:', error);
            });
  });
</script>

</body>
</html>
