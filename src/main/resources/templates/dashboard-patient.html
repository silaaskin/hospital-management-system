<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Hasta Paneli</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 20px; text-align: center; }
    .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 800px; margin: 40px auto; }
    .card-btn {
      padding: 30px; border-radius: 15px; background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-decoration: none;
      color: #333; font-size: 1.2rem; transition: 0.3s;
      border-left: 5px solid #28a745; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .card-btn:hover { transform: translateY(-5px); background: #28a745; color: white; }
    .card-btn i { font-size: 2.5rem; margin-bottom: 10px; }
    .logout { color: #dc3545; text-decoration: none; font-weight: bold; margin-top: 20px; display: inline-block; }
  </style>
</head>
<body>

<div class="mt-4">
  <h1 style="color:#28a745;"><i class="fas fa-user-injured"></i> Hoş Geldiniz</h1>
  <h3 class="text-secondary" th:text="${userName}"></h3>
  <p class="text-muted">Sağlık Yönetim Paneli</p>
</div>

<div th:if="${param.success}" class="alert alert-success w-50 mx-auto">
  ✅ İşlem başarıyla gerçekleşti!
</div>

<div th:if="${param.error}" class="alert alert-danger w-50 mx-auto">
  <i class="fas fa-exclamation-triangle"></i>
  <span th:text="${param.error}">Bir hata oluştu!</span>
</div>

<div class="container">
  <a href="/patients/appointments/book" class="card-btn">
    <i class="fas fa-calendar-plus"></i>
    <span>Yeni Randevu Al</span>
  </a>

  <a href="/appointments/view" class="card-btn" style="border-left-color: #17a2b8;">
    <i class="fas fa-calendar-alt"></i>
    <span>Randevularım</span>
  </a>

  <a href="/patients/prescriptions" class="card-btn" style="border-left-color: #ffc107;">
    <i class="fas fa-pills"></i>
    <span>Reçetelerim</span>
  </a>
</div>

<a href="/logout" class="logout"><i class="fas fa-sign-out-alt"></i> Güvenli Çıkış Yap</a>

</body>
</html>
