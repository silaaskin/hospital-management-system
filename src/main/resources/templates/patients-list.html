<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Hasta Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 shadow">
  <div class="container">
    <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
    <a href="/dashboard" class="btn btn-outline-light btn-sm">Panele Dön</a>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
      <h4 class="mb-0 text-primary"><i class="fas fa-users"></i> Kayıtlı Hastalar</h4>

      <a href="/patients/add" class="btn btn-success" th:if="${session.userType == 'SECRETARY'}">
        <i class="fas fa-user-plus"></i> Yeni Hasta Ekle
      </a>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0 align-middle">
          <thead class="table-dark">
          <tr>
            <th>TC Kimlik No</th>
            <th>Ad Soyad</th>
            <th>Telefon</th>
            <th class="text-center">İşlemler</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="p : ${patients}">
            <td><span class="badge bg-secondary" th:text="${p.tcNo}"></span></td>
            <td class="fw-bold" th:text="${p.firstName + ' ' + p.lastName}"></td>
            <td th:text="${p.phone}"></td>
            <td class="text-center">
              <a th:href="@{/patients/view/{id}(id=${p.id})}" class="btn btn-info btn-sm text-white" title="Detay Gör">
                <i class="fas fa-eye"></i>
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

</body>
</html>
