<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Yazılan Reçeteler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; min-height: 100vh; }
    .navbar-custom { background: linear-gradient(90deg, #1e40af 0%, #0f3460 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
    .page-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 0; margin-bottom: 40px; }
    .page-header h2 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; }
    .page-header p { opacity: 0.9; margin-bottom: 0; }
    .container-custom { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 15px; flex-wrap: wrap; }
    .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-filter { background: #e5e7eb; color: #374151; padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
    .btn-filter.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .btn-filter:hover { background: #d1d5db; }
    .btn-back { background: #6b7280; color: white; padding: 12px 25px; border: none; border-radius: 8px; font-weight: 600; text-decoration: none; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-back:hover { background: #4b5563; color: white; }
    .prescription-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 25px; margin-bottom: 40px; }
    .prescription-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; transition: all 0.3s; border-left: 5px solid #667eea; }
    .prescription-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
    .header-content { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .prescription-number { font-weight: 700; font-size: 1.2rem; }
    .prescription-date { font-size: 0.85rem; opacity: 0.9; }
    .card-body { padding: 25px; }
    .patient-info { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0; }
    .patient-icon { font-size: 1.8rem; color: #667eea; }
    .patient-name { font-weight: 600; color: #1f2937; font-size: 1.05rem; }
    .prescription-content { }
    .prescription-section { margin-bottom: 15px; }
    .section-label { font-weight: 600; color: #6b7280; font-size: 0.85rem; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
    .section-text { color: #374151; font-size: 0.95rem; padding: 10px; background: #f9fafb; border-left: 3px solid #667eea; border-radius: 4px; }
    .empty-state { text-align: center; padding: 80px 20px; }
    .empty-state i { font-size: 4rem; color: #d1d5db; margin-bottom: 20px; }
    .empty-state h4 { color: #6b7280; font-weight: 600; margin-bottom: 10px; }
    .empty-state p { color: #9ca3af; }
    @media (max-width: 768px) {
      .page-header h2 { font-size: 1.5rem; }
      .prescription-grid { grid-template-columns: 1fr; }
      .action-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
    <a href="/dashboard" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Panele Dön</a>
  </div>
</nav>

<div class="page-header">
  <div class="container-custom">
    <h2><i class="fas fa-file-prescription"></i> <span th:text="${pageTitle}">Yazılan Reçeteler</span></h2>
    <p>Hastalarınıza yazdığınız tüm reçeteler</p>
  </div>
</div>

<div class="container-custom">
  <div class="action-bar">
    <div class="filter-buttons">
      <button class="btn-filter active" onclick="filterPrescriptions('all')">
        <i class="fas fa-list"></i> Tümü
      </button>
      <button class="btn-filter" onclick="filterPrescriptions('recent')">
        <i class="fas fa-clock"></i> Son 7 Gün
      </button>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(prescriptions)}" class="empty-state">
    <i class="fas fa-prescription-bottle"></i>
    <h4>Reçete Kaydı Bulunamadı</h4>
    <p>Henüz yazılan bir reçete bulunmamaktadır.</p>
  </div>

  <div th:if="${!#lists.isEmpty(prescriptions)}" class="prescription-grid">
    <div th:each="item : ${prescriptions}" class="prescription-card">
      <div class="card-header">
        <div class="header-content">
          <div>
            <div class="prescription-number">Reçete #<span th:text="${item.id}"></span></div>
            <div class="prescription-date" th:text="${item.prescriptionDate}"></div>
          </div>
          <i class="fas fa-file-medical" style="font-size: 1.5rem; opacity: 0.8;"></i>
        </div>
      </div>

      <div class="card-body">
        <div class="patient-info">
          <div class="patient-icon"><i class="fas fa-user-injured"></i></div>
          <div>
            <div class="section-label">Hasta</div>
            <div class="patient-name" th:text="${item.patient.firstName + ' ' + item.patient.lastName}"></div>
          </div>
        </div>

        <div class="prescription-content">
          <div class="prescription-section">
            <div class="section-label"><i class="fas fa-capsules"></i> İlaçlar</div>
            <div class="section-text" th:text="${item.medications}"></div>
          </div>

          <div class="prescription-section" th:if="${item.dosage}">
            <div class="section-label"><i class="fas fa-prescription-bottle"></i> Kullanım</div>
            <div class="section-text" th:text="${item.dosage}"></div>
          </div>

          <div class="prescription-section" th:if="${item.instructions}">
            <div class="section-label"><i class="fas fa-info-circle"></i> Talimatlar</div>
            <div class="section-text" th:text="${item.instructions}"></div>
          </div>

          <div class="prescription-section" th:if="${item.notes}">
            <div class="section-label"><i class="fas fa-sticky-note"></i> Not</div>
            <div class="section-text" th:text="${item.notes}"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function filterPrescriptions(filter) {
    document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
    event.target.closest('.btn-filter').classList.add('active');
    // Burada filtreleme işlemi yapılabilir
  }
</script>

</body>
</html>
