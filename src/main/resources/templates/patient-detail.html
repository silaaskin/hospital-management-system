<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hasta Detayı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <a href="/patients/view" class="btn btn-outline-secondary mb-3"><i class="fas fa-arrow-left"></i> Listeye Dön</a>

            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0"><i class="fas fa-user-injured"></i> Hasta Kimlik Kartı</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 text-center border-end">
                            <i class="fas fa-user-circle fa-8x text-secondary mb-3 mt-3"></i>
                            <h3 th:text="${patient.firstName + ' ' + patient.lastName}"></h3>
                            <span class="badge bg-primary fs-6" th:text="${'TC: ' + patient.tcNo}"></span>
                        </div>
                        <div class="col-md-8">
                            <table class="table table-borderless">
                                <tbody>
                                <tr>
                                    <th class="text-muted" style="width: 140px;">Telefon:</th>
                                    <td class="fw-bold fs-5" th:text="${patient.phone}"></td>
                                </tr>
                                <tr>
                                    <th class="text-muted">Doğum Tarihi:</th>
                                    <td th:text="${patient.birthDate != null ? patient.birthDate : '-'}"></td>
                                </tr>
                                <tr>
                                    <th class="text-muted">Kan Grubu:</th>
                                    <td th:text="${patient.bloodType != null ? patient.bloodType : '-'}"></td>
                                </tr>
                                <tr>
                                    <th class="text-muted">E-Posta:</th>
                                    <td th:text="${patient.email != null ? patient.email : '-'}"></td>
                                </tr>
                                <tr>
                                    <th class="text-muted">Adres:</th>
                                    <td th:text="${patient.address != null ? patient.address : '-'}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-warning text-white">
                            <i class="fas fa-edit"></i> Düzenle
                        </a>

                        <button class="btn btn-danger" th:onclick="'deletePatient(' + ${patient.id} + ')'">
                            <i class="fas fa-trash"></i> Sil
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Silme Fonksiyonu
    function deletePatient(id) {
        if(confirm("Bu hasta kaydını silmek istediğinize emin misiniz?")) {
            fetch('/patients/api/' + id, {
                method: 'DELETE'
            }).then(response => {
                if(response.ok) {
                    alert("Hasta silindi!");
                    window.location.href = "/patients/view"; // Listeye geri at
                } else {
                    alert("Silinemedi! Hastanın aktif randevusu olabilir.");
                }
            });
        }
    }
</script>

</body>
</html>
