<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hasta Detayı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%); min-height: 100vh; padding: 40px 20px; }
        .navbar-custom { background: linear-gradient(90deg, #1e40af 0%, #0f3460 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 40px; }
        .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .container-wrapper { max-width: 900px; margin: 0 auto; }
        .back-button { background: #6b7280; color: white; padding: 10px 20px; border: none; border-radius: 8px; text-decoration: none; transition: all 0.3s; margin-bottom: 25px; display: inline-flex; align-items: center; gap: 8px; }
        .back-button:hover { background: #4b5563; color: white; }
        .detail-card { background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; margin-bottom: 25px; }
        .card-header-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; }
        .card-header-custom h3 { font-size: 1.6rem; font-weight: 700; margin-bottom: 5px; }
        .card-header-custom p { opacity: 0.9; margin-bottom: 0; }
        .card-body-custom { padding: 40px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; margin-bottom: 30px; }
        .avatar-section { text-align: center; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 3.5rem; color: white; box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3); }
        .patient-name { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 8px; }
        .tc-badge { background: #dbeafe; color: #1e40af; padding: 8px 16px; border-radius: 8px; font-weight: 600; display: inline-block; }
        .info-list { display: flex; flex-direction: column; gap: 18px; }
        .info-item { display: flex; align-items: flex-start; gap: 15px; padding: 15px; background: #f9fafb; border-radius: 10px; border-left: 4px solid #667eea; }
        .info-item i { font-size: 1.3rem; color: #667eea; margin-top: 2px; }
        .info-label { font-weight: 600; color: #6b7280; font-size: 0.9rem; display: block; margin-bottom: 4px; }
        .info-value { color: #1f2937; font-size: 1.05rem; }
        .divider { height: 2px; background: #e5e7eb; margin: 25px 0; }
        .action-buttons { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn-action { padding: 12px 25px; border: none; border-radius: 8px; font-weight: 600; text-decoration: none; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-edit:hover { background: #d97706; transform: translateY(-2px); color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-delete:hover { background: #dc2626; transform: translateY(-2px); color: white; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: 500; font-size: 0.85rem; background: #d1fae5; color: #065f46; }
        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            .btn-action { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">
        <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
    </div>
</nav>

<div class="container-wrapper">
    <a href="/patients/view" class="back-button">
        <i class="fas fa-arrow-left"></i> Listeye Dön
    </a>

    <div class="detail-card">
        <div class="card-header-custom">
            <h3><i class="fas fa-user-injured"></i> Hasta Kimlik Kartı</h3>
            <p>Kapsamlı Hasta Bilgileri</p>
        </div>

        <div class="card-body-custom">
            <div class="info-grid">
                <div class="avatar-section">
                    <div class="avatar"><i class="fas fa-user"></i></div>
                    <div class="patient-name" th:text="${patient.firstName + ' ' + patient.lastName}"></div>
                    <span class="tc-badge" th:text="${'TC: ' + patient.tcNo}"></span>
                </div>

                <div class="info-list">
                    <div class="info-item">
                        <i class="fas fa-phone"></i>
                        <div>
                            <span class="info-label">Telefon</span>
                            <span class="info-value" th:text="${patient.phone}"></span>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <div>
                            <span class="info-label">E-Posta</span>
                            <span class="info-value" th:text="${patient.email != null ? patient.email : 'Kayıtlı Değil'}"></span>
                        </div>
                    </div>

                    <div class="info-item">
                        <i class="fas fa-birthday-cake"></i>
                        <div>
                            <span class="info-label">Doğum Tarihi</span>
                            <span class="info-value" th:text="${patient.birthDate != null ? patient.birthDate : 'Kayıtlı Değil'}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="info-grid">
                <div class="info-item" style="grid-column: 1/-1;">
                    <i class="fas fa-droplet"></i>
                    <div>
                        <span class="info-label">Kan Grubu</span>
                        <span class="info-value" th:text="${patient.bloodType != null ? patient.bloodType : 'Kayıtlı Değil'}"></span>
                    </div>
                </div>

                <div class="info-item" style="grid-column: 1/-1;">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <span class="info-label">Adres</span>
                        <span class="info-value" th:text="${patient.address != null ? patient.address : 'Kayıtlı Değil'}"></span>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="action-buttons">
                <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn-action btn-edit">
                    <i class="fas fa-edit"></i> Bilgileri Düzenle
                </a>
                <button class="btn-action btn-delete" th:onclick="'deletePatient(' + ${patient.id} + ')'">
                    <i class="fas fa-trash"></i> Kaydı Sil
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function deletePatient(id) {
        if(confirm("Bu hasta kaydını silmek istediğinize emin misiniz? Bu işlem geri alınamaz.")) {
            fetch('/patients/api/' + id, {
                method: 'DELETE'
            }).then(response => {
                if(response.ok) {
                    alert("✅ Hasta kaydı başarıyla silindi!");
                    window.location.href = "/patients/view";
                } else {
                    alert("❌ Silinemedi! Hastanın aktif randevusu veya işlemi olabilir.");
                }
            }).catch(err => {
                alert("❌ Hata: " + err.message);
            });
        }
    }
</script>

</body>
</html>
