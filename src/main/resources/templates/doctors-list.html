<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doktor Listesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; min-height: 100vh; }
        .navbar-custom { background: linear-gradient(90deg, #1e40af 0%, #0f3460 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .page-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 0; margin-bottom: 40px; }
        .page-header h2 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; }
        .page-header p { opacity: 0.9; margin-bottom: 0; }
        .container-custom { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 15px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input { padding: 12px 15px; border: 2px solid #e5e7eb; border-radius: 8px; width: 100%; transition: all 0.3s; }
        .search-box input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); outline: none; }
        .btn-back { background: #6b7280; color: white; padding: 12px 25px; border: none; border-radius: 8px; font-weight: 600; text-decoration: none; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-back:hover { background: #4b5563; color: white; }
        .doctor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .doctor-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; transition: all 0.3s; border-top: 4px solid #667eea; }
        .doctor-card:hover { transform: translateY(-8px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .card-header-doc { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; text-align: center; }
        .doctor-avatar { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2.5rem; border: 2px solid white; }
        .doctor-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; }
        .specialization-badge { background: rgba(255,255,255,0.3); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-block; }
        .card-body-doc { padding: 20px; }
        .info-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 15px; }
        .info-icon { color: #667eea; font-size: 1.1rem; margin-top: 2px; flex-shrink: 0; }
        .info-label { font-weight: 600; color: #6b7280; font-size: 0.85rem; }
        .info-value { color: #374151; font-size: 0.95rem; }
        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-state i { font-size: 4rem; color: #d1d5db; margin-bottom: 20px; }
        .empty-state h4 { color: #6b7280; font-weight: 600; margin-bottom: 10px; }
        .empty-state p { color: #9ca3af; }
        @media (max-width: 768px) {
            .page-header h2 { font-size: 1.5rem; }
            .doctor-grid { grid-template-columns: 1fr; }
            .action-bar { flex-direction: column; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">
        <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
        <a href="/dashboard" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Panele Dön</a>
    </div>
</nav>

<div class="page-header">
    <div class="container-custom">
        <h2><i class="fas fa-user-md"></i> Doktor Listesi</h2>
        <p>Hastanedeki tüm doktorlar ve branşları</p>
    </div>
</div>

<div class="container-custom">
    <div class="action-bar">
        <div class="search-box">
            <input type="text" id="searchInput" class="form-control" placeholder="Doktor adı veya branş ile ara...">
        </div>
    </div>

    <div th:if="${#lists.isEmpty(doctors)}" class="empty-state">
        <i class="fas fa-user-md"></i>
        <h4>Doktor Kaydı Bulunamadı</h4>
        <p>Henüz sisteme kayıtlı bir doktor bulunmamaktadır.</p>
    </div>

    <div th:if="${!#lists.isEmpty(doctors)}" class="doctor-grid">
        <div th:each="doc : ${doctors}" class="doctor-card">
            <div class="card-header-doc">
                <div class="doctor-avatar">
                    <i class="fas fa-user-md"></i>
                </div>
                <div class="doctor-name" th:text="${'Dr. ' + doc.firstName + ' ' + doc.lastName}"></div>
                <span class="specialization-badge" th:text="${doc.specialization}"></span>
            </div>

            <div class="card-body-doc">
                <div class="info-item">
                    <i class="info-icon fas fa-briefcase"></i>
                    <div>
                        <div class="info-label">Departman</div>
                        <div class="info-value" th:text="${doc.department}"></div>
                    </div>
                </div>

                <div class="info-item">
                    <i class="info-icon fas fa-graduation-cap"></i>
                    <div>
                        <div class="info-label">Uzmanlık</div>
                        <div class="info-value" th:text="${doc.specialization}"></div>
                    </div>
                </div>

                <div class="info-item" th:if="${doc.phone}">
                    <i class="info-icon fas fa-phone"></i>
                    <div>
                        <div class="info-label">Telefon</div>
                        <div class="info-value" th:text="${doc.phone}"></div>
                    </div>
                </div>

                <div class="info-item" th:if="${doc.email}">
                    <i class="info-icon fas fa-envelope"></i>
                    <div>
                        <div class="info-label">E-Posta</div>
                        <div class="info-value" th:text="${doc.email}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const searchInput = document.getElementById('searchInput');

    if (searchInput) {
        searchInput.addEventListener('keyup', function() {
            const searchTerm = this.value.toLowerCase();
            const cards = document.querySelectorAll('.doctor-card');

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    }
</script>

</body>
</html>
