<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doktor Listesi - MHRS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --mhrs-primary: #0d6efd;
            --mhrs-success: #28a745;
            --mhrs-info: #17a2b8;
            --mhrs-teal: #20c997;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin: 30px auto;
            padding: 0;
            max-width: 1400px;
            overflow: hidden;
        }

        .page-header {
            background: linear-gradient(135deg, var(--mhrs-primary) 0%, var(--mhrs-info) 100%);
            color: white;
            padding: 30px 40px;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .page-header h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-header .btn {
            position: relative;
            z-index: 1;
        }

        .content-wrapper {
            padding: 40px;
        }

        /* Search & Filter Section */
        .search-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 12px 45px 12px 20px;
            width: 100%;
            font-size: 15px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--mhrs-primary);
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 18px;
        }

        /* Doctor Cards */
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .doctor-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            border: 2px solid #e9ecef;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .doctor-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            border-color: var(--mhrs-primary);
        }

        .card-header-custom {
            background: linear-gradient(135deg, var(--mhrs-primary) 0%, var(--mhrs-info) 100%);
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .doctor-avatar {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--mhrs-primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .doctor-name {
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }

        .card-body-custom {
            padding: 25px 20px;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .info-row:hover {
            background: #e9ecef;
        }

        .info-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, var(--mhrs-primary) 0%, var(--mhrs-info) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 11px;
            color: #6c757d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 15px;
            color: #2c3e50;
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .empty-state i {
            font-size: 80px;
            color: #dee2e6;
            margin-bottom: 20px;
        }

        .empty-state h5 {
            color: #6c757d;
            font-weight: 600;
            margin: 0;
        }

        /* Stats Section */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            border-left: 4px solid var(--mhrs-primary);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--mhrs-primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #6c757d;
            font-weight: 600;
        }

        /* Back Button */
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 25px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: white;
            color: var(--mhrs-primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header {
                padding: 20px;
            }

            .page-header h2 {
                font-size: 22px;
            }

            .content-wrapper {
                padding: 20px;
            }

            .doctors-grid {
                grid-template-columns: 1fr;
            }

            .stats-section {
                grid-template-columns: 1fr;
            }
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .doctor-card {
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="main-container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="d-flex justify-content-between align-items-center">
                <h2>
                    <i class="fas fa-user-md"></i>
                    <span th:text="${pageTitle}">Doktor Listesi</span>
                </h2>
                <a href="/dashboard" class="back-btn">
                    <i class="fas fa-arrow-left"></i>Panele Dön
                </a>
            </div>
        </div>

        <div class="content-wrapper">
            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-number" th:text="${#lists.size(doctors)}">0</div>
                    <div class="stat-label">Toplam Doktor</div>
                </div>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Doktor adı, uzmanlık veya departman ara..."
                           onkeyup="filterDoctors()">
                    <i class="fas fa-search"></i>
                </div>
            </div>

            <!-- Doctors Grid -->
            <div class="doctors-grid" id="doctorsGrid">
                <div class="doctor-card" th:each="doc, iterStat : ${doctors}"
                     th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's'">
                    <div class="card-header-custom">
                        <div class="doctor-avatar">
                            <i class="fas fa-user-md"></i>
                        </div>
                        <h3 class="doctor-name" th:text="'Dr. ' + ${doc.firstName} + ' ' + ${doc.lastName}">
                            Dr. İsim Soyisim
                        </h3>
                    </div>
                    <div class="card-body-custom">
                        <div class="info-row">
                            <div class="info-icon">
                                <i class="fas fa-stethoscope"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label">Uzmanlık Alanı</div>
                                <div class="info-value" th:text="${doc.specialization}">Kardiyoloji</div>
                            </div>
                        </div>
                        <div class="info-row">
                            <div class="info-icon">
                                <i class="fas fa-hospital"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label">Departman</div>
                                <div class="info-value" th:text="${doc.department}">Kalp Sağlığı</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-user-md-slash"></i>
                <h5>Aradığınız kriterlere uygun doktor bulunamadı</h5>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function filterDoctors() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.doctor-card');
        const grid = document.getElementById('doctorsGrid');
        const emptyState = document.getElementById('emptyState');
        let visibleCount = 0;

        cards.forEach(card => {
            const name = card.querySelector('.doctor-name').textContent.toLowerCase();
            const specialization = card.querySelectorAll('.info-value')[0].textContent.toLowerCase();
            const department = card.querySelectorAll('.info-value')[1].textContent.toLowerCase();

            if (name.includes(searchTerm) || specialization.includes(searchTerm) || department.includes(searchTerm)) {
                card.style.display = 'block';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        if (visibleCount === 0) {
            grid.style.display = 'none';
            emptyState.style.display = 'block';
        } else {
            grid.style.display = 'grid';
            emptyState.style.display = 'none';
        }
    }
</script>

</body>
</html>
