<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Vital Bilgi Güncelleme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #dbeafe 100%); min-height: 100vh; padding: 40px 20px; }
    .navbar-custom { background: linear-gradient(90deg, #1e40af 0%, #0f3460 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 40px; }
    .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
    .container-wrapper { max-width: 700px; margin: 0 auto; }
    .form-card { background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; border-top: 6px solid #0891b2; }
    .form-header { background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%); color: white; padding: 40px; text-align: center; }
    .form-header h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; }
    .form-header p { opacity: 0.9; margin-bottom: 0; }
    .form-body { padding: 40px; }
    .section-title { font-size: 1.1rem; font-weight: 600; color: #0891b2; margin-top: 25px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #cffafe; display: flex; align-items: center; gap: 10px; }
    .section-title:first-of-type { margin-top: 0; }
    .section-title i { font-size: 1.3rem; }
    .form-group { margin-bottom: 20px; }
    .form-label { font-weight: 600; color: #1f2937; margin-bottom: 8px; display: block; }
    .form-control, .form-select { padding: 12px 15px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 0.95rem; transition: all 0.3s; }
    .form-control:focus, .form-select:focus { border-color: #0891b2; box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.1); outline: none; }
    .form-control::placeholder { color: #9ca3af; }
    .row-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .row-group.three { grid-template-columns: 1fr 1fr 1fr; }
    .row-group.full { grid-template-columns: 1fr; }
    .vital-input-group { display: flex; align-items: flex-end; gap: 10px; }
    .vital-input-group .form-control { margin-bottom: 0; }
    .unit-label { color: #6b7280; font-weight: 600; padding-bottom: 10px; }
    .info-badge { background: #cffafe; color: #164e63; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .info-badge i { font-size: 1.3rem; }
    .button-group { display: flex; gap: 15px; margin-top: 35px; }
    .btn-save { background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%); color: white; padding: 14px 40px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(8, 145, 178, 0.3); color: white; }
    .btn-cancel { background: #e5e7eb; color: #374151; padding: 14px 40px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
    .btn-cancel:hover { background: #d1d5db; color: #374151; }
    @media (max-width: 768px) {
      .form-header { padding: 30px; }
      .form-body { padding: 25px; }
      .row-group, .row-group.three { grid-template-columns: 1fr; }
      .button-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
  </div>
</nav>

<div class="container-wrapper">
  <div class="form-card">
    <div class="form-header">
      <h2><i class="fas fa-sync-alt"></i> Vital Bilgi Güncelleme</h2>
      <p>Hasta ölçümlerini güncelleyin</p>
    </div>

    <div class="form-body">
      <form th:action="@{/triage/update}" method="post">
        <input type="hidden" name="id" th:value="${record.id}">

        <div class="info-badge">
          <i class="fas fa-user-injured"></i>
          <div>
            <strong>Hasta:</strong> <span th:text="${record.patient.firstName + ' ' + record.patient.lastName}"></span>
          </div>
        </div>

        <!-- VİTAL BULGULAR -->
        <div class="section-title">
          <i class="fas fa-heartbeat"></i> Vital Bulgular
        </div>

        <div class="row-group three">
          <div class="form-group">
            <label class="form-label"><i class="fas fa-thermometer"></i> Ateş</label>
            <div class="vital-input-group">
              <input type="number" step="0.1" name="temperature" class="form-control" th:value="${record.temperature}" required>
              <div class="unit-label">°C</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fas fa-heart"></i> Nabız</label>
            <div class="vital-input-group">
              <input type="number" name="heartRate" class="form-control" th:value="${record.heartRate}" required>
              <div class="unit-label">/dk</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fas fa-tint"></i> Oksijen</label>
            <div class="vital-input-group">
              <input type="number" name="oxygenSaturation" class="form-control" th:value="${record.oxygenSaturation}">
              <div class="unit-label">%</div>
            </div>
          </div>
        </div>

        <div class="row-group">
          <div class="form-group">
            <label class="form-label"><i class="fas fa-arrow-up"></i> Büyük Tansiyon</label>
            <div class="vital-input-group">
              <input type="number" name="bloodPressureSystolic" class="form-control" th:value="${record.bloodPressureSystolic}">
              <div class="unit-label">mmHg</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label"><i class="fas fa-arrow-down"></i> Küçük Tansiyon</label>
            <div class="vital-input-group">
              <input type="number" name="bloodPressureDiastolic" class="form-control" th:value="${record.bloodPressureDiastolic}">
              <div class="unit-label">mmHg</div>
            </div>
          </div>
        </div>

        <!-- ŞİKAYET -->
        <div class="section-title">
          <i class="fas fa-notes-medical"></i> Şikayet Özeti
        </div>

        <div class="form-group row-group full">
          <label class="form-label">Hastanın Şikayeti</label>
          <textarea name="symptoms" class="form-control" rows="3" th:text="${record.symptoms}"></textarea>
        </div>

        <!-- NOTLAR -->
        <div class="section-title">
          <i class="fas fa-clipboard-list"></i> Ek Notlar
        </div>

        <div class="form-group row-group full">
          <label class="form-label">Doktor Notları</label>
          <textarea name="notes" class="form-control" rows="3" th:text="${record.notes}"></textarea>
        </div>

        <!-- BUTONLAR -->
        <div class="button-group">
          <button type="submit" class="btn-save">
            <i class="fas fa-check"></i> Değişiklikleri Kaydet
          </button>
          <a href="/triage/view" class="btn-cancel">
            <i class="fas fa-times"></i> İptal Et
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
