<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Vital Bilgi Güncelleme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<div class="container" style="max-width: 600px;">
  <div class="card shadow border-0">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0"><i class="fas fa-sync-alt"></i> Vital Bulguları Güncelle</h5>
    </div>
    <div class="card-body">
      <form th:action="@{/triage/update}" method="post">
        <input type="hidden" name="id" th:value="${record.id}">
        <div class="mb-3">
          <label class="form-label fw-bold">Ateş (°C)</label>
          <input type="number" step="0.1" name="temperature" class="form-control" th:value="${record.temperature}" required>
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label fw-bold">Nabız</label>
            <input type="number" name="heartRate" class="form-control" th:value="${record.heartRate}" required>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label fw-bold">Büyük Tansiyon</label>
            <input type="number" name="bloodPressureSystolic" class="form-control" th:value="${record.bloodPressureSystolic}">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Şikayet Özeti</label>
          <textarea name="symptoms" class="form-control" rows="3" th:text="${record.symptoms}"></textarea>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-success">Değişiklikleri Uygula</button>
          <a href="/triage/view" class="btn btn-outline-secondary">İptal</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
