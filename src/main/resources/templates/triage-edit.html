<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vital Bilgi Güncelleme - MHRS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
        --mhrs-primary: #0d6efd;
        --mhrs-success: #28a745;
    }

    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 30px 15px;
    }

    .update-container {
        max-width: 700px;
        margin: 0 auto;
    }

    .update-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        overflow: hidden;
        animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card-header-update {
        background: linear-gradient(135deg, var(--mhrs-primary) 0%, #17a2b8 100%);
        color: white;
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .card-header-update::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 300px;
        height: 300px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
    }

    .card-header-update h5 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        position: relative;
        z-index: 1;
    }

    .card-body-update {
        padding: 40px 35px;
    }

    .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-control {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 12px 15px;
        font-size: 15px;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: var(--mhrs-primary);
        box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
    }

    textarea.form-control {
        resize: vertical;
        min-height: 100px;
    }

    .btn-update {
        background: linear-gradient(135deg, var(--mhrs-success) 0%, #20c997 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(40,167,69,0.3);
    }

    .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(40,167,69,0.4);
        color: white;
    }

    .btn-cancel-update {
        background: white;
        color: #6c757d;
        border: 2px solid #6c757d;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }

    .btn-cancel-update:hover {
        background: #6c757d;
        color: white;
        transform: translateY(-2px);
        text-decoration: none;
    }

    @media (max-width: 768px) {
        .card-body-update {
            padding: 30px 20px;
        }
    }
  </style>
</head>
<body>

<div class="update-container">
  <div class="update-card">
    <div class="card-header-update">
      <h5>
        <i class="fas fa-sync-alt me-2"></i>
        Vital Bulguları Güncelle
      </h5>
    </div>

    <div class="card-body-update">
      <form th:action="@{/triage/update}" method="post">
        <input type="hidden" name="id" th:value="${record.id}">

        <div class="mb-3">
          <label class="form-label">
            <i class="fas fa-thermometer-half text-danger"></i>
            Ateş (°C)
          </label>
          <input type="number"
                 step="0.1"
                 name="temperature"
                 class="form-control"
                 th:value="${record.temperature}"
                 required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">
              <i class="fas fa-heartbeat text-danger"></i>
              Nabız / Dakika
            </label>
            <input type="number"
                   name="heartRate"
                   class="form-control"
                   th:value="${record.heartRate}"
                   required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">
              <i class="fas fa-tachometer-alt text-primary"></i>
              Büyük Tansiyon
            </label>
            <input type="number"
                   name="bloodPressureSystolic"
                   class="form-control"
                   th:value="${record.bloodPressureSystolic}">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">
            <i class="fas fa-tachometer-alt text-info"></i>
            Küçük Tansiyon
          </label>
          <input type="number"
                 name="bloodPressureDiastolic"
                 class="form-control"
                 th:value="${record.bloodPressureDiastolic}">
        </div>

        <div class="mb-4">
          <label class="form-label">
            <i class="fas fa-notes-medical text-success"></i>
            Şikayet Özeti
          </label>
          <textarea name="symptoms"
                    class="form-control"
                    rows="3"
                    th:text="${record.symptoms}"></textarea>
        </div>

        <div class="d-grid gap-3">
          <button type="submit" class="btn-update">
            <i class="fas fa-save me-2"></i>
            Değişiklikleri Uygula
          </button>
          <a href="/triage/view" class="btn-cancel-update">
            <i class="fas fa-times-circle me-2"></i>
            İptal
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
