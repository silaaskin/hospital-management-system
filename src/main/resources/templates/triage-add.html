<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Acil Hasta Girişi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow border-0 border-top border-5 border-danger">
        <div class="card-header bg-white text-center">
          <h3 class="text-danger fw-bold"><i class="fas fa-ambulance"></i> Acil Durum Girişi</h3>
          <p class="text-muted mb-0">Triaj ve Vital Bulgular</p>
        </div>
        <div class="card-body p-4">

          <div th:if="${param.error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> Hasta bulunamadı! Lütfen TC numarasını kontrol edin.
          </div>

          <form action="/triage/add" method="post">

            <h5 class="text-secondary border-bottom pb-2 mb-3">1. Hasta Bilgisi</h5>
            <div class="mb-3">
              <label class="form-label fw-bold">Hasta TC Kimlik No</label>
              <input type="text" name="tcNo" class="form-control form-control-lg" placeholder="11 haneli TC giriniz" required maxlength="11">
              <div class="form-text">Hasta sisteme kayıtlı olmalıdır. Değilse önce 'Hasta Ekle' ekranından kaydedin.</div>
            </div>

            <h5 class="text-secondary border-bottom pb-2 mb-3 mt-4">2. Vital Bulgular (Ölçümler)</h5>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Ateş (°C)</label>
                <input type="number" step="0.1" name="temperature" class="form-control" placeholder="36.5" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Nabız / Dakika</label>
                <input type="number" name="heartRate" class="form-control" placeholder="80" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Büyük Tansiyon</label>
                <input type="number" name="bloodPressureSystolic" class="form-control" placeholder="120">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Küçük Tansiyon</label>
                <input type="number" name="bloodPressureDiastolic" class="form-control" placeholder="80">
              </div>
            </div>

            <h5 class="text-secondary border-bottom pb-2 mb-3 mt-4">3. Şikayet ve Belirtiler</h5>
            <div class="mb-3">
              <label class="form-label">Hastanın Şikayeti</label>
              <textarea name="symptoms" class="form-control" rows="3" placeholder="Örn: Göğüs ağrısı, nefes darlığı, yüksek ateş..." required></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Notlar (Opsiyonel)</label>
              <textarea name="notes" class="form-control" rows="2"></textarea>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-danger btn-lg">
                <i class="fas fa-save"></i> Acil Kaydını Oluştur
              </button>
              <a href="/dashboard" class="btn btn-secondary">İptal</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
