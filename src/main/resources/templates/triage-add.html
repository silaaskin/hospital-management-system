<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acil Hasta Girişi - MHRS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
        --emergency-red: #dc3545;
        --emergency-dark: #1a1d20;
    }

    body {
        background: linear-gradient(135deg, #1a1d20 0%, #2c3e50 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 30px 15px;
    }

    .emergency-container {
        max-width: 900px;
        margin: 0 auto;
    }

    .emergency-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        overflow: hidden;
        animation: slideUp 0.6s ease-out;
        border-top: 8px solid var(--emergency-red);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card-header-emergency {
        background: linear-gradient(135deg, var(--emergency-red) 0%, #e74c3c 100%);
        color: white;
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .card-header-emergency::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 300px;
        height: 300px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
    }

    .header-content {
        position: relative;
        z-index: 1;
    }

    .emergency-icon {
        font-size: 40px;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
    }

    .card-title-emergency {
        font-size: 28px;
        font-weight: 800;
        margin: 15px 0 5px;
    }

    .card-subtitle {
        color: rgba(255,255,255,0.9);
        font-size: 15px;
        margin: 0;
    }

    .card-body-emergency {
        padding: 40px 35px;
    }

    /* Alert */
    .alert-custom {
        background: linear-gradient(135deg, #f8d7da 0%, #f5b7bd 100%);
        border-left: 5px solid var(--emergency-red);
        border-radius: 12px;
        padding: 15px 20px;
        margin-bottom: 25px;
    }

    /* Section Headers */
    .section-header {
        color: #2c3e50;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 3px solid #e9ecef;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .section-number {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--emergency-red) 0%, #e74c3c 100%);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
    }

    /* Form Elements */
    .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .form-control,
    .form-select {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 12px 15px;
        font-size: 15px;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: var(--emergency-red);
        box-shadow: 0 0 0 0.2rem rgba(220,53,69,0.15);
    }

    textarea.form-control {
        resize: vertical;
        min-height: 100px;
    }

    .form-text-custom {
        color: #6c757d;
        font-size: 12px;
        margin-top: 5px;
    }

    /* Buttons */
    .btn-emergency {
        background: linear-gradient(135deg, var(--emergency-red) 0%, #e74c3c 100%);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(220,53,69,0.3);
    }

    .btn-emergency:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(220,53,69,0.4);
        color: white;
    }

    .btn-cancel {
        background: #6c757d;
        color: white;
        border: none;
        padding: 16px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }

    .btn-cancel:hover {
        background: #5a6268;
        transform: translateY(-2px);
        color: white;
        text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .card-body-emergency {
            padding: 30px 20px;
        }

        .card-title-emergency {
            font-size: 24px;
        }
    }
  </style>
</head>
<body>

<div class="emergency-container">
  <div class="emergency-card">
    <!-- Card Header -->
    <div class="card-header-emergency">
      <div class="header-content">
        <i class="fas fa-ambulance emergency-icon"></i>
        <h3 class="card-title-emergency">Acil Durum Girişi</h3>
        <p class="card-subtitle">Triaj ve Vital Bulgular</p>
      </div>
    </div>

    <div class="card-body-emergency">
      <!-- Error Alert -->
      <div th:if="${param.error}" class="alert-custom">
        <i class="fas fa-exclamation-circle me-2"></i>
        <strong>Hata:</strong> Hasta bulunamadı! Lütfen TC numarasını kontrol edin.
      </div>

      <form action="/triage/add" method="post">
        <!-- 1. Hasta Bilgisi -->
        <div class="section-header">
          <span class="section-number">1</span>
          <i class="fas fa-user-injured"></i>
          <span>Hasta Bilgisi</span>
        </div>

        <div class="mb-4">
          <label class="form-label">
            Hasta TC Kimlik No <span class="text-danger">*</span>
          </label>
          <input type="text"
                 name="tcNo"
                 class="form-control form-control-lg"
                 placeholder="11 haneli TC giriniz"
                 required
                 maxlength="11"
                 pattern="[0-9]{11}">
          <div class="form-text-custom">
            <i class="fas fa-info-circle me-1"></i>
            Hasta sisteme kayıtlı olmalıdır. Değilse önce 'Hasta Ekle' ekranından kaydedin.
          </div>
        </div>

        <!-- 2. Vital Bulgular -->
        <div class="section-header">
          <span class="section-number">2</span>
          <i class="fas fa-heartbeat"></i>
          <span>Vital Bulgular (Ölçümler)</span>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">
              <i class="fas fa-thermometer-half text-danger me-2"></i>
              Ateş (°C) <span class="text-danger">*</span>
            </label>
            <input type="number"
                   step="0.1"
                   name="temperature"
                   class="form-control"
                   placeholder="36.5"
                   required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">
              <i class="fas fa-heartbeat text-danger me-2"></i>
              Nabız / Dakika <span class="text-danger">*</span>
            </label>
            <input type="number"
                   name="heartRate"
                   class="form-control"
                   placeholder="80"
                   required>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6 mb-3">
            <label class="form-label">
              <i class="fas fa-tachometer-alt text-primary me-2"></i>
              Büyük Tansiyon (Sistolik)
            </label>
            <input type="number"
                   name="bloodPressureSystolic"
                   class="form-control"
                   placeholder="120">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">
              <i class="fas fa-tachometer-alt text-info me-2"></i>
              Küçük Tansiyon (Diyastolik)
            </label>
            <input type="number"
                   name="bloodPressureDiastolic"
                   class="form-control"
                   placeholder="80">
          </div>
        </div>

        <!-- 3. Şikayet -->
        <div class="section-header">
          <span class="section-number">3</span>
          <i class="fas fa-notes-medical"></i>
          <span>Şikayet ve Belirtiler</span>
        </div>

        <div class="mb-3">
          <label class="form-label">
            Hastanın Şikayeti <span class="text-danger">*</span>
          </label>
          <textarea name="symptoms"
                    class="form-control"
                    rows="3"
                    placeholder="Örn: Göğüs ağrısı, nefes darlığı, yüksek ateş..."
                    required></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label">Notlar (Opsiyonel)</label>
          <textarea name="notes"
                    class="form-control"
                    rows="2"
                    placeholder="Ek bilgiler veya gözlemler..."></textarea>
        </div>

        <!-- Buttons -->
        <div class="d-grid gap-3">
          <button type="submit" class="btn-emergency">
            <i class="fas fa-save me-2"></i>
            Acil Kaydını Oluştur
          </button>
          <a href="/dashboard" class="btn-cancel">
            <i class="fas fa-times-circle me-2"></i>
            İptal
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // TC sadece rakam
  document.querySelector('input[name="tcNo"]').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
  });
</script>

</body>
</html>
