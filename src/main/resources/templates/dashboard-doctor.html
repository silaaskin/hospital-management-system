<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Doktor Paneli</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 20px; text-align: center; }
    .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 800px; margin: 40px auto; }
    .card { padding: 30px; border-radius: 10px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-decoration: none; color: #333; font-size: 1.2rem; transition: 0.3s; border-left: 5px solid #007bff; }
    .card:hover { transform: translateY(-5px); background: #007bff; color: white; }
    .logout { color: #dc3545; text-decoration: none; font-weight: bold; margin-top: 20px; display: inline-block; }
  </style>
</head>
<body>
<h1 style="color:#007bff;">Hoş Geldiniz, Dr. <span th:text="${userName}"></span></h1>
<p>Yetkili Personel Paneli</p>

<div class="container">
  <a href="/appointments/view" class="card">📅 Randevuları Yönet</a>
  <a href="/patients/view" class="card">👤 Hasta Kayıtları</a>
  <a href="/prescriptions/view" class="card">💊 Reçete Yaz</a>
  <a href="/triage/view" class="card" style="border-left-color: #dc3545;">🚨 Acil / Triaj</a>
</div>

<a href="/logout" class="logout">Güvenli Çıkış Yap</a>
</body>
</html>
