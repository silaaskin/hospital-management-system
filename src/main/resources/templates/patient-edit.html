<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasta Düzenle - MHRS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
        --mhrs-warning: #ffc107;
        --mhrs-primary: #0d6efd;
        --mhrs-success: #28a745;
    }

    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 30px 15px;
    }

    .edit-container {
        max-width: 800px;
        margin: 0 auto;
    }

    .edit-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        overflow: hidden;
        animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card-header-edit {
        background: linear-gradient(135deg, var(--mhrs-warning) 0%, #fd7e14 100%);
        color: white;
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .card-header-edit::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -10%;
        width: 300px;
        height: 300px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
    }

    .card-header-edit h4 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        position: relative;
        z-index: 1;
    }

    .card-body-edit {
        padding: 40px 35px;
    }

    .form-label {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .form-control {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 12px 15px;
        font-size: 15px;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: var(--mhrs-warning);
        box-shadow: 0 0 0 0.2rem rgba(255,193,7,0.15);
    }

    textarea.form-control {
        resize: vertical;
        min-height: 80px;
    }

    .btn-update {
        background: linear-gradient(135deg, var(--mhrs-warning) 0%, #fd7e14 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(255,193,7,0.3);
    }

    .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255,193,7,0.4);
        color: white;
    }

    .btn-update.loading {
        position: relative;
        color: transparent;
    }

    .btn-update.loading::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        top: 50%;
        left: 50%;
        margin-left: -10px;
        margin-top: -10px;
        border: 3px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
        .card-body-edit {
            padding: 30px 20px;
        }
    }
  </style>
</head>
<body>

<div class="edit-container">
  <div class="edit-card">
    <div class="card-header-edit">
      <h4>
        <i class="fas fa-edit"></i>
        Hasta Bilgilerini Düzenle
      </h4>
    </div>

    <div class="card-body-edit">
      <form id="editForm">
        <input type="hidden" id="patientId" th:value="${patient.id}">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Ad</label>
            <input type="text"
                   id="firstName"
                   class="form-control"
                   th:value="${patient.firstName}"
                   required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Soyad</label>
            <input type="text"
                   id="lastName"
                   class="form-control"
                   th:value="${patient.lastName}"
                   required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">TC Kimlik No</label>
          <input type="text"
                 id="tcNo"
                 class="form-control"
                 th:value="${patient.tcNo}"
                 maxlength="11"
                 required>
        </div>

        <div class="mb-3">
          <label class="form-label">Telefon</label>
          <input type="text"
                 id="phone"
                 class="form-control"
                 th:value="${patient.phone}"
                 maxlength="10"
                 required>
        </div>

        <div class="mb-3">
          <label class="form-label">E-Posta</label>
          <input type="email"
                 id="email"
                 class="form-control"
                 th:value="${patient.email}">
        </div>

        <div class="mb-3">
          <label class="form-label">Kan Grubu</label>
          <select id="bloodType" class="form-control" th:value="${patient.bloodType}">
            <option value="">Seçiniz</option>
            <option value="A+" th:selected="${patient.bloodType == 'A+'}">A Rh+</option>
            <option value="A-" th:selected="${patient.bloodType == 'A-'}">A Rh-</option>
            <option value="B+" th:selected="${patient.bloodType == 'B+'}">B Rh+</option>
            <option value="B-" th:selected="${patient.bloodType == 'B-'}">B Rh-</option>
            <option value="AB+" th:selected="${patient.bloodType == 'AB+'}">AB Rh+</option>
            <option value="AB-" th:selected="${patient.bloodType == 'AB-'}">AB Rh-</option>
            <option value="0+" th:selected="${patient.bloodType == '0+'}">0 Rh+</option>
            <option value="0-" th:selected="${patient.bloodType == '0-'}">0 Rh-</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Adres</label>
          <textarea id="address"
                    class="form-control"
                    th:text="${patient.address}"></textarea>
        </div>

        <button type="submit" class="btn-update w-100" id="updateBtn">
          <i class="fas fa-save me-2"></i>
          Değişiklikleri Kaydet
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  // TC ve Telefon sadece rakam
  document.getElementById('tcNo').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
  });

  document.getElementById('phone').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
  });

  document.getElementById('editForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const id = document.getElementById('patientId').value;
      const updateBtn = document.getElementById('updateBtn');

      updateBtn.classList.add('loading');
      updateBtn.disabled = true;

      const data = {
          firstName: document.getElementById('firstName').value.trim(),
          lastName: document.getElementById('lastName').value.trim(),
          tcNo: document.getElementById('tcNo').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          email: document.getElementById('email').value.trim() || null,
          bloodType: document.getElementById('bloodType').value || null,
          address: document.getElementById('address').value.trim() || null
      };

      fetch('/patients/api/' + id, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
      })
      .then(res => {
          if(res.ok) {
              updateBtn.innerHTML = '<i class="fas fa-check-circle me-2"></i> Başarılı!';
              updateBtn.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';

              setTimeout(() => {
                  alert("✅ Güncelleme Başarılı!");
                  window.location.href = "/patients/view/" + id;
              }, 500);
          } else {
              throw new Error('Güncelleme başarısız!');
          }
      })
      .catch(err => {
          updateBtn.classList.remove('loading');
          updateBtn.disabled = false;
          alert("❌ Hata: " + err.message);
      });
  });
</script>

</body>
</html>
