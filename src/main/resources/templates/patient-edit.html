<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Hasta Düzenle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #fef3c7 100%); min-height: 100vh; padding: 40px 20px; }
    .navbar-custom { background: linear-gradient(90deg, #1e40af 0%, #0f3460 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 40px; }
    .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
    .container-wrapper { max-width: 700px; margin: 0 auto; }
    .form-card { background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
    .form-header { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 40px; text-align: center; }
    .form-header h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; }
    .form-header p { opacity: 0.9; margin-bottom: 0; }
    .form-body { padding: 40px; }
    .section-title { font-size: 1rem; font-weight: 600; color: #f59e0b; margin-top: 25px; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #fef3c7; }
    .section-title:first-of-type { margin-top: 0; }
    .form-group { margin-bottom: 18px; }
    .form-label { font-weight: 600; color: #1f2937; margin-bottom: 8px; display: block; }
    .form-control { padding: 12px 15px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 0.95rem; transition: all 0.3s; }
    .form-control:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); outline: none; }
    .row-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .row-group.full { grid-template-columns: 1fr; }
    .button-group { display: flex; gap: 15px; margin-top: 35px; }
    .btn-save { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 14px 40px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); color: white; }
    .btn-cancel { background: #e5e7eb; color: #374151; padding: 14px 40px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; flex: 1; }
    .btn-cancel:hover { background: #d1d5db; color: #374151; }
    .info-badge { background: #fef3c7; color: #92400e; padding: 8px 12px; border-radius: 6px; font-weight: 500; font-size: 0.85rem; display: inline-block; margin-bottom: 20px; }
    @media (max-width: 768px) {
      .form-header { padding: 30px; }
      .form-body { padding: 25px; }
      .row-group { grid-template-columns: 1fr; }
      .button-group { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
  </div>
</nav>

<div class="container-wrapper">
  <div class="form-card">
    <div class="form-header">
      <h2><i class="fas fa-edit"></i> Hasta Bilgilerini Düzenle</h2>
      <p>Hastanın kayıtlı bilgilerini güncelleyin</p>
    </div>

    <div class="form-body">
      <div class="info-badge">
        <i class="fas fa-id-card"></i> TC: <span th:text="${patient.tcNo}"></span>
      </div>

      <form id="editForm">
        <input type="hidden" id="patientId" th:value="${patient.id}">

        <div class="section-title"><i class="fas fa-user"></i> Kişisel Bilgiler</div>

        <div class="row-group">
          <div class="form-group">
            <label class="form-label">Ad</label>
            <input type="text" id="firstName" class="form-control" th:value="${patient.firstName}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Soyad</label>
            <input type="text" id="lastName" class="form-control" th:value="${patient.lastName}" required>
          </div>
        </div>

        <div class="section-title"><i class="fas fa-phone"></i> İletişim Bilgileri</div>

        <div class="row-group">
          <div class="form-group">
            <label class="form-label">Telefon</label>
            <input type="text" id="phone" class="form-control" th:value="${patient.phone}" required>
          </div>
          <div class="form-group">
            <label class="form-label">E-Posta</label>
            <input type="email" id="email" class="form-control" th:value="${patient.email}">
          </div>
        </div>

        <div class="form-group row-group full">
          <label class="form-label">Adres</label>
          <textarea id="address" class="form-control" rows="3" th:text="${patient.address}"></textarea>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-save">
            <i class="fas fa-check"></i> Değişiklikleri Kaydet
          </button>
          <a th:href="@{/patients/view/{id}(id=${patient.id})}" class="btn-cancel">
            <i class="fas fa-times"></i> İptal
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('editForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('patientId').value;
    const data = {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      tcNo: document.getElementById('tcNo').value || '[[${patient.tcNo}]]',
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      address: document.getElementById('address').value
    };

    fetch('/patients/api/' + id, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).then(res => {
      if(res.ok) {
        alert("✅ Hasta bilgileri başarıyla güncellendi!");
        window.location.href = "/patients/view/" + id;
      } else {
        alert("❌ Hata oluştu!");
      }
    }).catch(err => {
      alert("❌ Bağlantı hatası: " + err.message);
    });
  });
</script>

</body>
</html>
