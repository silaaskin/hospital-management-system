<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Hasta Düzenle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 700px;">
  <div class="card shadow">
    <div class="card-header bg-warning">
      <h4>✏️ Hasta Bilgilerini Düzenle</h4>
    </div>
    <div class="card-body">
      <form id="editForm">
        <input type="hidden" id="patientId" th:value="${patient.id}">

        <div class="row">
          <div class="col-6 mb-3">
            <label>Ad</label>
            <input type="text" id="firstName" class="form-control" th:value="${patient.firstName}" required>
          </div>
          <div class="col-6 mb-3">
            <label>Soyad</label>
            <input type="text" id="lastName" class="form-control" th:value="${patient.lastName}" required>
          </div>
        </div>

        <div class="mb-3">
          <label>TC No</label> <input type="text" id="tcNo" class="form-control" th:value="${patient.tcNo}" required>
        </div>

        <div class="mb-3">
          <label>Telefon</label>
          <input type="text" id="phone" class="form-control" th:value="${patient.phone}" required>
        </div>

        <div class="mb-3">
          <label>Adres</label>
          <textarea id="address" class="form-control" th:text="${patient.address}"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Değişiklikleri Kaydet</button>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('editForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('patientId').value;

    const data = {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      tcNo: document.getElementById('tcNo').value,
      phone: document.getElementById('phone').value,
      address: document.getElementById('address').value
      // Diğer alanlar da eklenebilir
    };

    fetch('/patients/api/' + id, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).then(res => {
      if(res.ok) {
        alert("Güncelleme Başarılı!");
        window.location.href = "/patients/view/" + id;
      } else {
        alert("Hata oluştu!");
      }
    });
  });
</script>
</body>
</html>
