<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Randevu Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .appointment-card { transition: all 0.3s; border-radius: 12px; border: 1px solid #eee; }
        .appointment-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(0,0,0,0.08) !important; }
        .badge-scheduled { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-completed { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .badge-cancelled { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .nav-pills .nav-link.active { background-color: #0d6efd !important; border-radius: 8px; color: white !important; }
        .nav-link { color: #495057; font-weight: 500; }
        .modal-backdrop { display: none; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .action-buttons { gap: 0.5rem; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h3 class="text-primary fw-bold">
            <i class="fas fa-calendar-check me-2"></i>
            <span>Randevu Yönetimi</span>
        </h3>
        <a href="/dashboard" class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="fas fa-arrow-left me-1"></i> Panele Dön
        </a>
    </div>

    <ul class="nav nav-pills mb-4 shadow-sm p-2 bg-white rounded-3" id="appointmentTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="today-tab" data-bs-toggle="pill" data-bs-target="#today" type="button" role="tab">
                <i class="fas fa-clock me-1"></i> Bugün
                <span class="badge bg-primary ms-1" id="todayBadge">0</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tomorrow-tab" data-bs-toggle="pill" data-bs-target="#tomorrow" type="button" role="tab">
                <i class="fas fa-calendar-day me-1"></i> Yarın
                <span class="badge bg-secondary ms-1" id="tomorrowBadge">0</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="all-tab" data-bs-toggle="pill" data-bs-target="#all" type="button" role="tab">
                <i class="fas fa-list me-1"></i> Tüm Bekleyenler
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="history-tab" data-bs-toggle="pill" data-bs-target="#history" type="button" role="tab">
                <i class="fas fa-history me-1"></i> Geçmiş / Tamamlanan
                <span class="badge bg-success ms-1" id="completedBadge">0</span>
            </button>
        </li>
    </ul>

    <div class="tab-content" id="appointmentTabsContent">
        <div class="tab-pane fade show active" id="today" role="tabpanel">
            <div class="row g-4" id="todayContainer">
                <div class="col-12 text-center py-5">
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tomorrow" role="tabpanel">
            <div class="row g-4" id="tomorrowContainer">
                <div class="col-12 text-center py-5">
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="all" role="tabpanel">
            <div class="row g-4" id="allContainer">
                <div class="col-12 text-center py-5">
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="history" role="tabpanel">
            <div class="row g-4" id="historyContainer">
                <div class="col-12 text-center py-5">
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Reçete Yazma Modal -->
<div class="modal fade" id="prescriptionModal" tabindex="-1" aria-labelledby="prescriptionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title" id="prescriptionModalLabel">
                    <i class="fas fa-prescription-bottle me-2"></i>Reçete Yaz
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Hasta Adı</label>
                    <input type="text" class="form-control" id="prescriptionPatient" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Reçete Notları</label>
                    <textarea class="form-control" id="prescriptionNotes" rows="6" placeholder="İlaç adı, doz, kullanım süresi vb. bilgileri yazınız..."></textarea>
                </div>
                <div id="prescriptionError" class="alert alert-danger d-none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                <button type="button" class="btn btn-info" onclick="savePrescription()">
                    <i class="fas fa-save me-1"></i>Reçeteyi Kaydet
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Muayene Tamamlama Onay Modal -->
<div class="modal fade" id="completeModal" tabindex="-1" aria-labelledby="completeModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="completeModalLabel">
                    <i class="fas fa-check-circle me-2"></i>Muayeneyi Tamamla
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Hastanın muayenesini tamamlandı olarak işaretlemek istediğinizi onaylıyor musunuz?</p>
                <p class="mb-0"><strong>Hasta:</strong> <span id="completePatientName"></span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                <button type="button" class="btn btn-success" onclick="confirmComplete()">
                    <i class="fas fa-check me-1"></i>Evet, Tamamla
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let currentAppointmentId = null;
    let appointments = {
        today: [],
        tomorrow: [],
        pending: [],
        completed: [],
        cancelled: []
    };

    // Sayfayı yükle
    document.addEventListener('DOMContentLoaded', function() {
        loadAppointments();
    });

    function loadAppointments() {
        fetch('/appointments/api/doctor-appointments')
            .then(res => res.json())
            .then(data => {
                appointments = data;
                renderAppointments();
                updateBadges();
            })
            .catch(err => console.error('Hata:', err));
    }

    function updateBadges() {
        document.getElementById('todayBadge').textContent = appointments.today ? appointments.today.length : 0;
        document.getElementById('tomorrowBadge').textContent = appointments.tomorrow ? appointments.tomorrow.length : 0;
        document.getElementById('completedBadge').textContent = (appointments.completed ? appointments.completed.length : 0) + (appointments.cancelled ? appointments.cancelled.length : 0);
    }

    function renderAppointments() {
        renderCards('todayContainer', appointments.today);
        renderCards('tomorrowContainer', appointments.tomorrow);
        renderCards('allContainer', appointments.pending);

        let historyCards = [];
        if (appointments.completed) historyCards = historyCards.concat(appointments.completed);
        if (appointments.cancelled) historyCards = historyCards.concat(appointments.cancelled);
        renderCards('historyContainer', historyCards);
    }

    function renderCards(containerId, apps) {
        const container = document.getElementById(containerId);

        if (!apps || apps.length === 0) {
            container.innerHTML = '<div class="col-12 text-center py-5 border rounded bg-white"><p class="text-muted mb-0">Randevu bulunmuyor.</p></div>';
            return;
        }

        container.innerHTML = apps.map(app => `
            <div class="col-md-6 col-lg-4">
                <div class="card appointment-card shadow-sm h-100 border-0 bg-white">
                    <div class="card-header bg-transparent border-0 pt-3 d-flex justify-content-between align-items-center">
                        <span class="text-dark small fw-bold">
                            <i class="far fa-calendar-alt text-primary me-1"></i>
                            ${formatDate(app.appointmentDate)}
                        </span>
                        <span class="badge ${getStatusBadgeClass(app.status)}">
                            ${getStatusText(app.status)}
                        </span>
                    </div>
                    <div class="card-body pt-2">
                        <h6 class="text-muted mb-1 small">Hasta Bilgisi</h6>
                        <h5 class="card-title fw-bold mb-1">${app.patientName || 'Bilinmeyen Hasta'}</h5>
                        <p class="text-primary small mb-0">
                            <i class="fas fa-fingerprint me-1"></i> ${app.patientTcNo || '---'}
                        </p>
                    </div>
                    ${app.status === 'SCHEDULED' ? `
                        <div class="card-footer bg-transparent border-top pt-2 pb-3">
                            <div class="d-grid gap-2">
                                <button class="btn btn-success btn-sm rounded-3" onclick="showCompleteModal(${app.id}, '${app.patientName}')">
                                    <i class="fas fa-check-circle me-1"></i>Muayene Bitti
                                </button>
                                <button class="btn btn-info btn-sm rounded-3" onclick="showPrescriptionModal(${app.id}, '${app.patientName}')">
                                    <i class="fas fa-prescription-bottle me-1"></i>Reçete Yaz
                                </button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('tr-TR') + ' ' + date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    }

    function getStatusBadgeClass(status) {
        switch(status) {
            case 'SCHEDULED': return 'badge-scheduled';
            case 'COMPLETED': return 'badge-completed';
            case 'CANCELLED': return 'badge-cancelled';
            default: return 'badge-secondary';
        }
    }

    function getStatusText(status) {
        switch(status) {
            case 'SCHEDULED': return 'Bekliyor';
            case 'COMPLETED': return 'Tamamlandı';
            case 'CANCELLED': return 'İptal';
            default: return 'Belirsiz';
        }
    }

    function showCompleteModal(appointmentId, patientName) {
        currentAppointmentId = appointmentId;
        document.getElementById('completePatientName').textContent = patientName;

        const modal = new bootstrap.Modal(document.getElementById('completeModal'));
        modal.show();
    }

    function confirmComplete() {
        fetch('/appointments/api/' + currentAppointmentId + '/complete', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(res => {
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('completeModal')).hide();
                    loadAppointments();
                } else {
                    alert('Hata oluştu');
                }
            })
            .catch(err => alert('Hata: ' + err.message));
    }

    function showPrescriptionModal(appointmentId, patientName) {
        currentAppointmentId = appointmentId;
        document.getElementById('prescriptionPatient').value = patientName;
        document.getElementById('prescriptionNotes').value = '';
        document.getElementById('prescriptionError').classList.add('d-none');

        const modal = new bootstrap.Modal(document.getElementById('prescriptionModal'));
        modal.show();
    }

    function savePrescription() {
        const notes = document.getElementById('prescriptionNotes').value.trim();
        const errorDiv = document.getElementById('prescriptionError');

        if (!notes) {
            errorDiv.textContent = 'Lütfen reçete notlarını girin';
            errorDiv.classList.remove('d-none');
            return;
        }

        const data = {
            appointmentId: currentAppointmentId,
            prescription: notes
        };

        fetch('/appointments/api/save-prescription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(res => {
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('prescriptionModal')).hide();
                    alert('Reçete başarıyla kaydedildi');
                    loadAppointments();
                } else {
                    throw new Error('Hata oluştu');
                }
            })
            .catch(err => {
                errorDiv.textContent = 'Hata: ' + err.message;
                errorDiv.classList.remove('d-none');
            });
    }
</script>

</body>
</html>
