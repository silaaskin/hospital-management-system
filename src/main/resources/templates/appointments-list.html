<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Randevu Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; min-height: 100vh; }
        .navbar-custom { background: linear-gradient(90deg, #1e40af 0%, #0f3460 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .navbar-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .page-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 0; margin-bottom: 40px; }
        .page-header h2 { font-size: 2rem; font-weight: 700; margin-bottom: 5px; }
        .page-header p { opacity: 0.9; margin-bottom: 0; }
        .container-custom { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .tabs-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 30px; }
        .nav-pills { gap: 0; flex-wrap: nowrap; overflow-x: auto; padding: 0; }
        .nav-item { margin: 0; }
        .nav-link {
            border-radius: 0;
            padding: 16px 20px;
            font-weight: 600;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            background: transparent;
            white-space: nowrap;
        }
        .nav-link:hover { background: #f3f4f6; color: #1f2937; }
        .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-color: #667eea;
        }
        .badge { margin-left: 8px; padding: 4px 10px; font-size: 0.8rem; }
        .tab-content { padding: 0; }
        .tab-pane { padding: 30px 0; }
        .appointment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; }
        .appointment-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: all 0.3s;
            border-left: 5px solid #667eea;
            display: flex;
            flex-direction: column;
        }
        .appointment-card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
        .card-header-appt {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .date-time { font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .badge-scheduled { background: rgba(255,255,255,0.3); color: white; }
        .badge-completed { background: #d4edda; color: #155724; }
        .badge-cancelled { background: #f8d7da; color: #721c24; }
        .card-body-appt {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .patient-section { margin-bottom: 15px; }
        .section-label {
            font-weight: 600;
            color: #6b7280;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .patient-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 6px;
        }
        .patient-tc {
            font-size: 0.9rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
        }
        .btn-complete { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-complete:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3); color: white; }
        .btn-prescription { background: linear-gradient(135deg, #0891b2, #0e7490); color: white; }
        .btn-prescription:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(8, 145, 178, 0.3); color: white; }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 12px;
        }
        .empty-state i { font-size: 4rem; color: #d1d5db; margin-bottom: 20px; }
        .empty-state h4 { color: #6b7280; font-weight: 600; margin-bottom: 10px; }
        .empty-state p { color: #9ca3af; }

        /* Modal Styles */
        .modal-content { border: none; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .modal-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; }
        .modal-header .btn-close { filter: invert(1); }
        .form-label { font-weight: 600; color: #1f2937; }
        .form-control, .form-select { border: 2px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; }
        .form-control:focus, .form-select:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }

        @media (max-width: 768px) {
            .page-header h2 { font-size: 1.5rem; }
            .appointment-grid { grid-template-columns: 1fr; }
            .nav-link { padding: 12px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom">
    <div class="container-fluid">
        <span class="navbar-brand"><i class="fas fa-hospital"></i> Hastane Yönetim Sistemi</span>
        <a href="/dashboard" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> Panele Dön</a>
    </div>
</nav>

<div class="page-header">
    <div class="container-custom">
        <h2><i class="fas fa-calendar-check"></i> Randevu Yönetimi</h2>
        <p>Randevularınızı görüntüleyin ve yönetin</p>
    </div>
</div>

<div class="container-custom">
    <div class="tabs-container">
        <ul class="nav nav-pills" id="appointmentTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="today-tab" data-bs-toggle="pill" data-bs-target="#today" type="button" role="tab">
                    <i class="fas fa-clock"></i> Bugün
                    <span class="badge bg-primary" id="todayBadge">0</span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tomorrow-tab" data-bs-toggle="pill" data-bs-target="#tomorrow" type="button" role="tab">
                    <i class="fas fa-calendar-day"></i> Yarın
                    <span class="badge bg-secondary" id="tomorrowBadge">0</span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="all-tab" data-bs-toggle="pill" data-bs-target="#all" type="button" role="tab">
                    <i class="fas fa-list"></i> Tüm Bekleyenler
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="history-tab" data-bs-toggle="pill" data-bs-target="#history" type="button" role="tab">
                    <i class="fas fa-history"></i> Geçmiş / Tamamlanan
                    <span class="badge bg-success" id="completedBadge">0</span>
                </button>
            </li>
        </ul>
    </div>

    <div class="tab-content" id="appointmentTabsContent">
        <!-- BUGÜN -->
        <div class="tab-pane fade show active" id="today" role="tabpanel">
            <div class="appointment-grid" id="todayContainer">
                <div class="empty-state" style="grid-column: 1/-1;">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <!-- YARIN -->
        <div class="tab-pane fade" id="tomorrow" role="tabpanel">
            <div class="appointment-grid" id="tomorrowContainer">
                <div class="empty-state" style="grid-column: 1/-1;">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <!-- TÜM BEKLEYENLER -->
        <div class="tab-pane fade" id="all" role="tabpanel">
            <div class="appointment-grid" id="allContainer">
                <div class="empty-state" style="grid-column: 1/-1;">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <!-- GEÇMİŞ -->
        <div class="tab-pane fade" id="history" role="tabpanel">
            <div class="appointment-grid" id="historyContainer">
                <div class="empty-state" style="grid-column: 1/-1;">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- REÇETE YAZMA MODAL -->
<div class="modal fade" id="prescriptionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-prescription-bottle me-2"></i>Reçete Yaz</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user-injured"></i> Hasta Adı</label>
                    <input type="text" class="form-control" id="prescriptionPatient" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-capsules"></i> Reçete Notları</label>
                    <textarea class="form-control" id="prescriptionNotes" rows="6" placeholder="İlaç adı, doz, kullanım süresi vb. bilgileri yazınız..."></textarea>
                </div>
                <div id="prescriptionError" class="alert alert-danger d-none" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> İptal
                </button>
                <button type="button" class="btn btn-primary" onclick="savePrescription()">
                    <i class="fas fa-save"></i> Reçeteyi Kaydet
                </button>
            </div>
        </div>
    </div>
</div>

<!-- MUAYENE TAMAMLAMA MODAL -->
<div class="modal fade" id="completeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-check-circle me-2"></i>Muayeneyi Tamamla</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info" role="alert">
                    <i class="fas fa-info-circle"></i> Hastanın muayenesini tamamlandı olarak işaretlemek istediğinizi onaylıyor musunuz?
                </div>
                <p class="mb-0">
                    <strong><i class="fas fa-user-injured"></i> Hasta:</strong>
                    <span id="completePatientName" class="fw-bold"></span>
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> İptal
                </button>
                <button type="button" class="btn btn-success" onclick="confirmComplete()">
                    <i class="fas fa-check"></i> Evet, Tamamla
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let currentAppointmentId = null;
    let appointments = {
        today: [],
        tomorrow: [],
        pending: [],
        completed: [],
        cancelled: []
    };

    document.addEventListener('DOMContentLoaded', function() {
        loadAppointments();
    });

    function loadAppointments() {
        fetch('/appointments/api/doctor-appointments')
            .then(res => res.json())
            .then(data => {
                appointments = data;
                renderAppointments();
                updateBadges();
            })
            .catch(err => {
                console.error('Hata:', err);
                showError('Randevular yüklenirken hata oluştu');
            });
    }

    function updateBadges() {
        document.getElementById('todayBadge').textContent = appointments.today ? appointments.today.length : 0;
        document.getElementById('tomorrowBadge').textContent = appointments.tomorrow ? appointments.tomorrow.length : 0;
        document.getElementById('completedBadge').textContent = (appointments.completed ? appointments.completed.length : 0) + (appointments.cancelled ? appointments.cancelled.length : 0);
    }

    function renderAppointments() {
        renderCards('todayContainer', appointments.today);
        renderCards('tomorrowContainer', appointments.tomorrow);
        renderCards('allContainer', appointments.pending);

        let historyCards = [];
        if (appointments.completed) historyCards = historyCards.concat(appointments.completed);
        if (appointments.cancelled) historyCards = historyCards.concat(appointments.cancelled);
        renderCards('historyContainer', historyCards);
    }

    function renderCards(containerId, apps) {
        const container = document.getElementById(containerId);

        if (!apps || apps.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1;">
                    <i class="fas fa-calendar-check"></i>
                    <h4>Randevu Bulunamadı</h4>
                    <p>Bu kategoride randevu bulunmamaktadır.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = apps.map(app => `
            <div class="appointment-card">
                <div class="card-header-appt">
                    <div class="date-time">
                        <i class="far fa-calendar-alt"></i>
                        <span>${formatDate(app.appointmentDate)}</span>
                    </div>
                    <span class="status-badge badge-${app.status.toLowerCase()}">${getStatusText(app.status)}</span>
                </div>
                <div class="card-body-appt">
                    <div class="patient-section">
                        <div class="section-label"><i class="fas fa-user-injured"></i> Hasta Bilgisi</div>
                        <div class="patient-name">${app.patientName || 'Bilinmeyen Hasta'}</div>
                        <div class="patient-tc">
                            <i class="fas fa-id-card"></i>
                            ${app.patientTcNo || '---'}
                        </div>
                    </div>
                    ${app.status === 'SCHEDULED' ? `
                        <div class="action-buttons">
                            <button class="btn-action btn-complete" onclick="showCompleteModal(${app.id}, '${app.patientName}')">
                                <i class="fas fa-check"></i> Muayene Bitti
                            </button>
                            <button class="btn-action btn-prescription" onclick="showPrescriptionModal(${app.id}, '${app.patientName}')">
                                <i class="fas fa-prescription-bottle"></i> Reçete
                            </button>
                        </div>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        const day = date.toLocaleDateString('tr-TR');
        const time = date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        return `${day} ${time}`;
    }

    function getStatusText(status) {
        const statusMap = {
            'SCHEDULED': 'Bekliyor',
            'COMPLETED': 'Tamamlandı',
            'CANCELLED': 'İptal'
        };
        return statusMap[status] || 'Bilinmiyor';
    }

    function showCompleteModal(appointmentId, patientName) {
        currentAppointmentId = appointmentId;
        document.getElementById('completePatientName').textContent = patientName;
        new bootstrap.Modal(document.getElementById('completeModal')).show();
    }

    function confirmComplete() {
        fetch('/appointments/api/' + currentAppointmentId + '/complete', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(res => {
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('completeModal')).hide();
                    loadAppointments();
                    showSuccess('Muayene başarıyla tamamlandı');
                } else {
                    showError('Hata oluştu');
                }
            })
            .catch(err => showError('Hata: ' + err.message));
    }

    function showPrescriptionModal(appointmentId, patientName) {
        currentAppointmentId = appointmentId;
        document.getElementById('prescriptionPatient').value = patientName;
        document.getElementById('prescriptionNotes').value = '';
        document.getElementById('prescriptionError').classList.add('d-none');
        new bootstrap.Modal(document.getElementById('prescriptionModal')).show();
    }

    function savePrescription() {
        const notes = document.getElementById('prescriptionNotes').value.trim();
        const errorDiv = document.getElementById('prescriptionError');

        if (!notes) {
            document.getElementById('errorText').textContent = 'Lütfen reçete notlarını girin';
            errorDiv.classList.remove('d-none');
            return;
        }

        const data = {
            appointmentId: currentAppointmentId,
            prescription: notes
        };

        fetch('/appointments/api/save-prescription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(res => {
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('prescriptionModal')).hide();
                    loadAppointments();
                    showSuccess('Reçete başarıyla kaydedildi');
                } else {
                    throw new Error('Hata oluştu');
                }
            })
            .catch(err => {
                document.getElementById('errorText').textContent = err.message;
                errorDiv.classList.remove('d-none');
            });
    }

    function showSuccess(message) {
        const alert = document.createElement('div');
        alert.className = 'alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
        alert.style.zIndex = '9999';
        alert.innerHTML = `
            <i class="fas fa-check-circle"></i> ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        document.body.appendChild(alert);
        setTimeout(() => alert.remove(), 3000);
    }

    function showError(message) {
        const alert = document.createElement('div');
        alert.className = 'alert alert-danger alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3';
        alert.style.zIndex = '9999';
        alert.innerHTML = `
            <i class="fas fa-exclamation-circle"></i> ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        document.body.appendChild(alert);
        setTimeout(() => alert.remove(), 4000);
    }
</script>

</body>
</html>
