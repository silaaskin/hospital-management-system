<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Randevu Listesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .appointment-card { transition: all 0.3s; border-radius: 12px; }
        .appointment-card:hover { box-shadow: 0 8px 15px rgba(0,0,0,0.1) !important; }
        .badge-scheduled { background-color: #ffc107; color: #000; }
        .badge-completed { background-color: #198754; }
        .badge-cancelled { background-color: #dc3545; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h3 class="text-primary fw-bold">
            <i class="fas fa-calendar-check me-2"></i>
            <span th:text="${pageTitle}">Randevular</span>
        </h3>
        <a href="/dashboard" class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="fas fa-arrow-left"></i> Panele Dön
        </a>
    </div>

    <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-info border-0 shadow-sm py-4 text-center">
        <i class="fas fa-info-circle fa-2x mb-2 d-block"></i>
        <span>Şu an görüntülenecek bir randevu kaydı bulunmamaktadır.</span>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="app : ${appointments}">
            <div class="card appointment-card shadow-sm h-100 border-0"
                 th:classappend="${app.status.name() == 'CANCELLED'} ? 'opacity-75' : ''">

                <div class="card-header bg-white border-bottom-0 pt-3 d-flex justify-content-between align-items-center">
                    <span class="text-muted small fw-bold">
                        <i class="far fa-clock text-primary me-1"></i>
                        <span th:text="${#temporals.format(app.appointmentDate, 'dd.MM.yyyy HH:mm')}"></span>
                    </span>
                    <span class="badge"
                          th:classappend="${app.status.name() == 'SCHEDULED' ? 'badge-scheduled' : (app.status.name() == 'COMPLETED' ? 'badge-completed' : 'badge-cancelled')}"
                          th:text="${app.status.name() == 'SCHEDULED' ? 'Bekliyor' : (app.status.name() == 'COMPLETED' ? 'Tamamlandı' : 'İptal')}">
                    </span>
                </div>

                <div class="card-body">
                    <div th:if="${session.userType == 'DOCTOR'}">
                        <h5 class="card-title fw-bold mb-1" th:text="${app.patient.firstName + ' ' + app.patient.lastName}"></h5>
                        <p class="text-primary small mb-2"><i class="fas fa-id-card me-1"></i> TC: <span th:text="${app.patient.tcNo}"></span></p>
                    </div>

                    <div th:if="${session.userType == 'PATIENT'}">
                        <h5 class="card-title fw-bold mb-1" th:text="${'Dr. ' + app.doctor.firstName + ' ' + app.doctor.lastName}"></h5>
                        <p class="text-info small mb-2"><i class="fas fa-stethoscope me-1"></i> <span th:text="${app.doctor.specialization}"></span></p>
                    </div>

                    <div class="bg-light p-2 rounded mt-3" th:if="${app.notes}">
                        <small class="text-muted d-block fw-bold">Randevu Notu:</small>
                        <span class="small text-dark" th:text="${app.notes}"></span>
                    </div>
                </div>

                <div class="card-footer bg-white border-top-0 pb-3" th:if="${session.userType == 'DOCTOR' and app.status.name() == 'SCHEDULED'}">
                    <div class="d-grid gap-2">
                        <button class="btn btn-primary btn-sm rounded-pill"
                                data-bs-toggle="modal"
                                data-bs-target="#prescriptionModal"
                                th:onclick="'preparePrescription(' + ${app.id} + ',' + ${app.doctor.id} + ')'">
                            <i class="fas fa-pen-fancy me-1"></i> Reçete Yaz
                        </button>
                        <button class="btn btn-success btn-sm rounded-pill" th:onclick="'completeAppointment(' + ${app.id} + ')'">
                            <i class="fas fa-check me-1"></i> Muayeneyi Tamamla
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="prescriptionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white border-0">
                <h5 class="modal-title fw-bold"><i class="fas fa-pills me-2"></i> Reçete Oluştur</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="prescForm">
                    <input type="hidden" id="p_appointmentId">
                    <input type="hidden" id="p_doctorId">

                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary">İlaç Listesi</label>
                        <textarea id="p_medications" class="form-control" rows="3" placeholder="Örn: Augmentin 1000mg" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Kullanım Şekli</label>
                        <input type="text" id="p_dosage" class="form-control" placeholder="Örn: 12 Saatte 1, Tok Karna">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tedavi Süresi (Gün)</label>
                            <input type="number" id="p_duration" class="form-control" value="7">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Ek Talimatlar</label>
                            <input type="text" id="p_instructions" class="form-control" placeholder="Günde 2 kez">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Doktor Notu</label>
                        <textarea id="p_notes" class="form-control" rows="2" placeholder="Hastaya özel uyarılar..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mt-2">
                        <i class="fas fa-save me-1"></i> Reçeteyi Sisteme Kaydet
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function preparePrescription(appId, docId) {
        document.getElementById('p_appointmentId').value = appId;
        document.getElementById('p_doctorId').value = docId;
    }

    function completeAppointment(id) {
        if(confirm("Bu muayeneyi tamamlandı olarak işaretleyip kapatmak istiyor musunuz?")) {
            fetch('/appointments/api/' + id + '/complete', { method: 'PUT' })
                .then(res => res.ok ? window.location.reload() : alert("Bir hata oluştu!"));
        }
    }

    document.getElementById('prescForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
            appointmentId: document.getElementById('p_appointmentId').value,
            doctorId: document.getElementById('p_doctorId').value,
            medications: document.getElementById('p_medications').value,
            dosage: document.getElementById('p_dosage').value,
            instructions: document.getElementById('p_instructions')?.value || "",
            durationDays: document.getElementById('p_duration').value,
            notes: document.getElementById('p_notes').value
        };

        fetch('/prescriptions/api', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(res => {
            if(res.ok) {
                alert("✅ Reçete başarıyla kaydedildi! Hasta ekranında anında görüntülenecektir.");
                window.location.reload();
            } else {
                alert("❌ Reçete oluşturulurken bir hata meydana geldi.");
            }
        });
    });
</script>

</body>
</html>
